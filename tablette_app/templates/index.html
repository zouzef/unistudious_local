<!--index.html-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unistudios class management</title>
    <!-- Bootstrap CSS -->
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="/static/css/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/css/style2.css" rel="stylesheet">
    <!-- Font Awesome 5 -->
    <link rel="stylesheet" href="/static/css/fa5-all.min.css">
    <!-- Select2 CSS -->
    <link href="/static/css/select2.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="/static/css/fa6-all.min.css">
</head>
<style>
  body {
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
  }
</style>
<body data-session-id="{{ session_info.id }}" data-tablet-id="{{ tablet_id }}">
    {% include 'header.html' %}
    <div class="container-fluid main-content">
        <div class="row">
            {% include 'left-content.html' %}
            {% include 'right-content.html' %}
        </div>
    </div>
    <script>
        const mainTabletId = "{{ tablet_id }}";
        console.log("Active session page - Tablet ID:", mainTabletId);

        function checkSession() {
          fetch(`/tablet/${encodeURIComponent(mainTabletId)}/check_session`)
            .then(response => {
              if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
              }
              return response.json();
            })
            .then(data => {
              if (data.status === 'no_session') {
                window.location.href = window.location.pathname + '?t=' + Date.now();
              }
            })
            .catch(err => {
              console.error("Error checking session:", err);
            });
        }

        checkSession();
        setInterval(checkSession, 10000);
  </script>
    <!-- Bootstrap JS -->
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="../static/js/js_page_tablet.js"></script>
    <!-- SweetAlert2 -->
    <script src="/static/js/sweetalert2.min.js"></script>
    <script src="/static/js/select2.min.js"></script>
</body>
</html>
