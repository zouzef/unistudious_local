<div class="content-body">
    <div class="container-fluid">
        <div class="top-bar">
            <div class="row">
                <div class="col-md-4">
                    <button type="button" class="btn btn-outline-secondary btn-custom js-single-click"
                            onclick="window.history.back()">
                        <i class="fas fa-arrow-left mt-1"></i> Return
                    </button>
                </div>
            </div>
        </div>
        <div id="calendar-info"
             data-session-id="{{ id_session }}"
             data-account-id="{{ account_id }}"
             style="display: none;">
        </div>
        <div class="row">
            <div class=" col-xl-12 p-2">


            </div>


            <div class="col-xl-12 col-xxl-12">
                <div class="card">
                    <div class="row">
                        <div class="col-xl-12" style="heig">
                            <div class="card mb-0" style="background-color: transparent;">
                                <div class="bootstrap-badge d-flex justify-content-between pt-4 px-5 pb-0">
                                    <div>
                                        <h2 class="heading mb-0 fw-bold text-primary">Session Attendance</h2>
                                    </div>
                                    <div class="d-flex align-items-center gap-2">
                                        <label for="eventFilter" class="fw-semibold text-muted">Filter by Type:</label>
                                        <select id="eventFilter" class="form-control native-select w-auto px-3 py-2">
                                            <option value="all">All</option>
                                            <option value="online">Online</option>
                                            <option value="in_person">In-Person</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="calendar" class="app-fullcalendar"></div>
                    </div>
                </div>
            </div>

            <!-- BEGIN MODAL -->
            <div class="modal fade none-border" id="event-modal">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h4 class="modal-title"><strong>Add New Event</strong></h4>
                        </div>
                        <div class="modal-body"></div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-default waves-effect" data-bs-dismiss="modal">Close
                            </button>
                            <button type="button" class="btn btn-success save-event waves-effect waves-light">Create
                                event
                            </button>
                            <button type="button" class="btn btn-danger delete-event waves-effect waves-light"
                                    data-bs-toggle="modal">Delete
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Modal Add Category -->
            <div class="modal fade none-border" id="add-category">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h4 class="modal-title"><strong>Add a category</strong></h4>
                        </div>
                        <div class="modal-body">
                            <form>
                                <div class="row">
                                    <div class="col-md-6">
                                        <label class="control-label form-label">Category Name</label>
                                        <input class="form-control form-white" placeholder="Enter name" type="text"
                                               name="category-name">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="control-label form-label">Choose Category Color</label>
                                        <select class="form-control form-white" data-placeholder="Choose a color..."
                                                name="category-color">
                                            <option value="success">Success</option>
                                            <option value="danger">Danger</option>
                                            <option value="info">Info</option>
                                            <option value="pink">Pink</option>
                                            <option value="primary">Primary</option>
                                            <option value="warning">Warning</option>
                                        </select>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-danger light waves-effect" data-bs-dismiss="modal">
                                Close
                            </button>
                            <button type="button" class="btn btn-primary waves-effect waves-light save-category"
                                    data-bs-toggle="modal">Save
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
