<div class="content-body">
    <div class="container-fluid">
        <div class="top-bar">
            <div class="row">
                <div class="col-md-4">
                    <a href="" class="btn btn-secondary btn-custom">
                        <i class="fas fa-arrow-left"></i> Return
                    </a>
                </div>
            </div>
        </div>
        <div class="col-xl-12 pt-4">
            <div class="card">
                <div class="card_header border-0 p-3">
                    <h4 class="heading mb-0">Lists Request Create Calander</h4>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table id="example" class="display dataTable no-footer"
                               style="min-width: 845px; width: 1518px;">
                            <thead>
                            <tr>
                                <th>Id</th>
                                <th>Name</th>
                                <th>Subject</th>
                                <th>Room</th>
                                <th>Session</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                            <tbody>
                            <!-- data load it dynamic -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>

    </div>

</div>
</div>

<script>

    async function loadCalendarRequests() {
        const accountId = window.ACCOUNT_ID; // Make sure this is defined

        try {
            const response = await fetch(`/api/get-calendar-request/${accountId}`);
            const data = await response.json();


            // FIX: Change from data.requests to data.data
            if (response.ok && data.data) {
                displayCalendarRequests(data.data);
            } else {
                console.error('No calendar requests found');
            }
        } catch (error) {
            console.error('Error loading calendar requests:', error);
        }
    }

    function displayCalendarRequests(requests) {
        const tbody = document.querySelector('#example tbody');
        tbody.innerHTML = ''; // Clear existing rows

        // Check if the table has an "Action" column
        const headers = document.querySelectorAll('#example thead th');
        const hasActionColumn = Array.from(headers).some(th => th.textContent.trim() === 'Action');

        requests.forEach(request => {
            const row = document.createElement('tr');

            // Determine status display based on accepted value
            let statusHTML = '';
            if (request.accepted === 0 || request.accepted === null) {
                statusHTML = `
                    <span class="badge light badge-primary" style="padding: 8px 12px; border-radius: 4px;">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="me-2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>Not Affected
                    </span>
                `;
            } else {
                if(request.accepted === 1 || request.accepted === null){
                    statusHTML = `
                        <button class="badge badge-lg light badge-success" style="border: none; padding: 8px 16px; border-radius: 4px; cursor: default;" disabled>
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="me-2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>Affected
                        </button>
                    `;
                }
                else{
                    statusHTML = `
                        <button class="badge badge-lg light badge-danger" style="border: none; padding: 8px 16px; border-radius: 4px; cursor: default;" disabled>
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="me-2"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>Rejected
                        </button>
                    `;
                }
            }

            // Action dropdown HTML (only if needed)
            let actionHTML = '';
            if (hasActionColumn) {
                actionHTML = `
                    <td>
                        <ul class="tbl-action">
                            <li>
                                <div class="custom-dropdown dropdown">
                                    <a href="javascript:void(0);" class="btn sharp btn-light dropdown-toggle-manual" data-request-id="${request.id}">
                                        <svg width="24" height="6" viewBox="0 0 24 6" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M12.0012 0.359985C11.6543 0.359985 11.3109 0.428302 10.9904 0.561035C10.67 0.693767 10.3788 0.888317 10.1335 1.13358C9.88829 1.37883 9.69374 1.67 9.56101 1.99044C9.42828 2.31089 9.35996 2.65434 9.35996 3.00119C9.35996 3.34803 9.42828 3.69148 9.56101 4.01193C9.69374 4.33237 9.88829 4.62354 10.1335 4.8688C10.3788 5.11405 10.67 5.3086 10.9904 5.44134C11.3109 5.57407 11.6543 5.64239 12.0012 5.64239C12.7017 5.64223 13.3734 5.36381 13.8686 4.86837C14.3638 4.37294 14.6419 3.70108 14.6418 3.00059C14.6416 2.3001 14.3632 1.62836 13.8677 1.13315C13.3723 0.637942 12.7004 0.359826 12 0.359985H12.0012ZM3.60116 0.359985C3.25431 0.359985 2.91086 0.428302 2.59042 0.561035C2.26997 0.693767 1.97881 0.888317 1.73355 1.13358C1.48829 1.37883 1.29374 1.67 1.16101 1.99044C1.02828 2.31089 0.959961 2.65434 0.959961 3.00119C0.959961 3.34803 1.02828 3.69148 1.16101 4.01193C1.29374 4.33237 1.48829 4.62354 1.73355 4.8688C1.97881 5.11405 2.26997 5.3086 2.59042 5.44134C2.91086 5.57407 3.25431 5.64239 3.60116 5.64239C4.30165 5.64223 4.97339 5.36381 5.4686 4.86837C5.9638 4.37294 6.24192 3.70108 6.24176 3.00059C6.2416 2.3001 5.96318 1.62836 5.46775 1.13315C4.97231 0.637942 4.30045 0.359826 3.59996 0.359985H3.60116ZM20.4012 0.359985C20.0543 0.359985 19.7109 0.428302 19.3904 0.561035C19.07 0.693767 18.7788 0.888317 18.5336 1.13358C18.2883 1.37883 18.0937 1.67 17.961 1.99044C17.8283 2.31089 17.76 2.65434 17.76 3.00119C17.76 3.34803 17.8283 3.69148 17.961 4.01193C18.0937 4.33237 18.2883 4.62354 18.5336 4.8688C18.7788 5.11405 19.07 5.3086 19.3904 5.44134C19.7109 5.57407 20.0543 5.64239 20.4012 5.64239C21.1017 5.64223 21.7734 5.36381 22.2686 4.86837C22.7638 4.37294 23.0419 3.70108 23.0418 3.00059C23.0416 2.3001 22.7632 1.62836 22.2677 1.13315C21.7723 0.637942 21.1005 0.359826 20.4 0.359985H20.4012Z" fill="#A098AE"></path>
                                        </svg>
                                    </a>
                                </div>
                            </li>
                        </ul>
                    </td>
                `;
            }

            row.innerHTML = `
                <td>${request.id}</td>
                <td>
                    <div class="trans-list">
                        ${request.username || 'N/A'}
                    </div>
                </td>
                <td>
                    <div class="d-flex align-items-center">
                        <div class="ms-2">
                            ${request.subject_name || 'N/A'}
                        </div>
                    </div>
                </td>
                <td>
                    ${request.room_name || 'N/A'}
                </td>
                <td>${request.session_name || 'N/A'}</td>
                <td>
                    ${statusHTML}
                </td>
                <td>${request.start_date || 'N/A'}</td>
                ${actionHTML}
            `;
            tbody.appendChild(row);
        });

        // Reinitialize DataTables
        if (typeof $.fn.DataTable !== 'undefined') {
            if ($.fn.DataTable.isDataTable('#example')) {
                $('#example').DataTable().destroy();
            }
            $('#example').DataTable({
                "paging": true,
                "searching": true,
                "ordering": true,
                "info": true,
                "lengthChange": true
            });
        }
    }

    // Updated event delegation with dynamic positioning
    document.addEventListener('DOMContentLoaded', function() {
        // Create a container for dropdowns in body
        if (!document.getElementById('dropdown-container')) {
            const container = document.createElement('div');
            container.id = 'dropdown-container';
            document.body.appendChild(container);
        }

        // Handle dropdown toggle clicks
        document.addEventListener('click', function(e) {
        // Toggle dropdown - ONLY for manual dropdowns (not Bootstrap ones)
        if (e.target.closest('.dropdown-toggle-manual')) {
            e.preventDefault();
            e.stopPropagation(); // prevent Bootstrap from also reacting
            const dropdownToggle = e.target.closest('.dropdown-toggle-manual');
            const requestId = dropdownToggle.getAttribute('data-request-id');

            document.querySelectorAll('.dynamic-dropdown-menu').forEach(menu => menu.remove());

            const rect = dropdownToggle.getBoundingClientRect();
            const menu = document.createElement('div');
            menu.className = 'dropdown-menu dropdown-menu-end dynamic-dropdown-menu show';
            menu.style.position = 'fixed';
            menu.style.top = `${rect.bottom + window.scrollY}px`;
            menu.style.left = `${rect.right - 160 + window.scrollX}px`;
            menu.style.zIndex = '9999';
            menu.style.minWidth = '160px';

            menu.innerHTML = `
                <a class="dropdown-item" href="javascript:void(0);" data-action="approve" data-id="${requestId}">Approve</a>
                <a class="dropdown-item" href="javascript:void(0);" data-action="reject" data-id="${requestId}">Reject</a>
                <a class="dropdown-item" href="javascript:void(0);" data-action="delete" data-id="${requestId}">Delete</a>

            `;

            document.getElementById('dropdown-container').appendChild(menu);
            return;
        }

        // Handle dropdown item clicks
        if (e.target.closest('.dynamic-dropdown-menu .dropdown-item')) {
            e.preventDefault();
            const item = e.target.closest('.dropdown-item');
            const action = item.getAttribute('data-action');
            const id = item.getAttribute('data-id');

            document.querySelectorAll('.dynamic-dropdown-menu').forEach(menu => menu.remove());

            if (action === 'approve') approveRequest(id);
            else if (action === 'reject') rejectRequest(id);
            else if (action === 'delete') deleteRequest(id);
            return;
        }

        // Close ONLY dynamic dropdowns, don't touch Bootstrap dropdowns
        if (!e.target.closest('.dropdown-toggle-manual') && !e.target.closest('.dynamic-dropdown-menu')) {
            document.querySelectorAll('.dynamic-dropdown-menu').forEach(menu => menu.remove());
        }
    });

        // Close dropdowns on scroll
        window.addEventListener('scroll', function() {
            document.querySelectorAll('.dynamic-dropdown-menu').forEach(menu => menu.remove());
        }, true);
    });

    // Action functions with SweetAlert2
    function approveRequest(id) {

        Swal.fire({
            title: 'Approve Request?',
            text: `Are you sure you want to approve request #${id}?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#28a745',
            cancelButtonColor: '#d33',
            confirmButtonText: 'Yes, approve it!',
            cancelButtonText: 'Cancel'
        }).then((result) => {

            if (!result.isConfirmed) return;

            fetch(`/api/approve-calander-request/${id}`, {
                method: 'POST'
            })
            .then(response => {
                return response.json().then(data => ({ status: response.status, data }));
            })
            .then(({ status, data }) => {

                if (status === 200) {
                    Swal.fire(
                        'Approved!',
                        `Request #${id} has been approved successfully.`,
                        'success'
                    ).then(() => {
                        loadCalendarRequests();
                    });
                    return;
                }

                // ── Handle conflict errors ────────────────────────────────
                const conflictMessages = {
                    'Room-Conflict':    { icon: '🏢', title: 'Room Already Reserved',       text: 'This room is not available at the selected time.' },
                    'Group-Conflict':   { icon: '👥', title: 'Group Not Available',          text: 'This group already has a session scheduled at this time.' },
                    'Teacher-Conflict': { icon: '👨‍🏫', title: 'Teacher Not Available',        text: 'This teacher already has a session scheduled at this time.' },
                };

                const errorKey   = data.Error;
                const conflict   = conflictMessages[errorKey];

                if (conflict) {
                    loadCalendarRequests()
                    Swal.fire({
                        icon: 'warning',
                        title: `${conflict.icon} ${conflict.title}`,
                        text: conflict.text,
                        confirmButtonColor: '#f0ad4e',
                    });
                } else {
                    // Generic fallback for other errors (color, not found, etc.)
                    Swal.fire({
                        icon: 'error',
                        title: 'Approval Failed',
                        text: data.Message || 'Something went wrong while approving the request.',
                        confirmButtonColor: '#d33',
                    });
                }

            })
            .catch(error => {
                console.error("Error:", error);
                Swal.fire({
                    icon: 'error',
                    title: 'Network Error',
                    text: 'Could not reach the server. Please try again.',
                    confirmButtonColor: '#d33',
                });
            });

        });
    }

    function rejectRequest(id) {
        Swal.fire({
            title: 'Reject Request?',
            text: `Are you sure you want to reject request #${id}?`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Yes, reject it!',
            cancelButtonText: 'Cancel'
        }).then((result) => {
            if (result.isConfirmed) {
                 fetch(`/api/reject-calander-request/${id}`, {
                    method: 'POST'
                  })
                 .then(response => {
                        if (!response.ok) {
                        throw new Error("Server error");
                 }
                 return response.json();
                 })
                 .then(data => {
                    Swal.fire(
                    'rejected!',
                    `Request #${id} has been rejected successfully.`,
                    'success'
                    ).then(() => {
                        loadCalendarRequests();
                    });
                })
                .catch(error => {
                    console.error("Error:", error);
                    Swal.fire(
                        'Error!',
                        'Something went wrong while approving the request.',
                        'error'
                    );
                });
                Swal.fire(
                    'Rejected!',
                    `Request #${id} has been rejected.`,
                    'success'
                ).then(() => {
                    // Reload the calendar requests
                    loadCalendarRequests();
                });
            }
        });
    }

    function deleteRequest(id) {
        Swal.fire({
        title:'Delete Requests?',
        text:'Are you sure you want to reject request # ${id}?',
        icon:'warning',
        showCancelButton:true,
        confirmButtonColor:'#d33',
        cancelButtonColor:'#6c757d',
        confirmButtonText:'Yes, delete it!',
        cancelButtonText:'Cancel'
        }).then((result)=>{
            if(result.isConfirmed){
             fetch(`/api/delete-calander-request/${id}`,{
                method:'POST'
             })
             .then(response => {
                if(!response.ok){
                    throw new Error("Server error");
                }
             return response.json()
             })
             .then(data => {
                Swal.fire(
                    'Deleted!',
                    `Request #${id} has been rejected successfully.`,
                    'success'
                ).then(() => {
                    loadCalendarRequests();
                });
             })
             .catch(error => {
                console.error("Error:",error);
                Swal.fire(
                    'Error!',
                    'Something went wrong while deleting the request.',
                    'error'
                );
             });
             Swal.fire(
                'Deleted!',
                'Request #${id} has been Deleted .',
                'success'
             ).then(() => {
                loadCalendarRequests();

             });
            }
        });
    }


    document.addEventListener('DOMContentLoaded', function() {
        loadCalendarRequests();
    });


</script>
