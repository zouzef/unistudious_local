<div class="content-body">
    <div class="container-fluid">
        <div class="row">
            <div class="col-xl-12">
                <div class="card">
                    <div class="card-header">
                        <h4 class="card-title">Add New Completion Tag</h4>
                    </div>
                    <div class="card-body">
                        <form id="completion-tag-form">
                            <div class="row">

                                <!-- Image -->
                                <div class="col-xl-3 col-sm-4">
                                    <div class="card card-bx profile-card author-profile m-b30">
                                        <div class="card-body">
                                            <div class="p-5">
                                                <div class="author-profile">
                                                    <div class="author-media-formation">
                                                        <img id="imagePreview"
                                                             src="../static/assets/images/completion_tag.png"
                                                             alt="">
                                                    </div>
                                                    <div class="change-btn mt-5 mb-lg-0 mb-3">
                                                        <input type="file" id="completion_tag_imgFile"
                                                               name="completion_tag[imgFile]"
                                                               class="d-none"
                                                               accept=".png, .jpg, .jpeg">
                                                        <label for="completion_tag_imgFile"
                                                               class="dlab-upload mb-0 btn btn-primary btn-sm">
                                                            Choose File
                                                        </label>
                                                        <a href="javascript:void(0);"
                                                           class="btn btn-danger light remove-img ms-2 btn-sm"
                                                           id="remove-img-completion-tag">Remove</a>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Fields -->
                                <div class="col-xl-9 col-lg-8">
                                    <div class="row">

                                        <!-- Name -->
                                        <div class="col-xl-12 col-sm-12">
                                            <div class="mb-3">
                                                <label class="form-label d-block" for="completion_tag_name">
                                                    Name <code class="highlighter-rouge">*</code>
                                                </label>
                                                <input type="text" id="completion_tag_name"
                                                       name="completion_tag[name]"
                                                       required class="form-control">
                                            </div>
                                        </div>

                                        <!-- Description -->
                                        <div class="col-xl-12 col-sm-12">
                                            <div class="mb-3">
                                                <label class="form-label d-block" for="completion_tag_description">
                                                    Description
                                                </label>
                                                <textarea id="completion_tag_description"
                                                          name="completion_tag[description]"
                                                          class="form-control" rows="7"
                                                          data-ckeditor="true"></textarea>
                                            </div>
                                        </div>

                                    </div>
                                </div>

                            </div>

                            <div class="float-end">
                                <button type="button" class="btn btn-outline-primary me-3"
                                        id="create_completion_tag">Create</button>
                                <a class="btn btn-outline-danger"
                                   href="/dashboard/show-completion-tag">Close</a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const ACCOUNT_ID = {{ account_id }};

    document.addEventListener('DOMContentLoaded', function () {

        // ─── Preview image on file select ─────────────────────────────────
        document.getElementById('completion_tag_imgFile').addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('imagePreview').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // ─── Remove image ──────────────────────────────────────────────────
        document.getElementById('remove-img-completion-tag').addEventListener('click', function () {
            document.getElementById('imagePreview').src = '/assets/admin/images/completion-tag-defult.jpg';
            document.getElementById('completion_tag_imgFile').value = '';
        });

        // ─── Create button → submit ────────────────────────────────────────
        document.getElementById('create_completion_tag').addEventListener('click', function () {

            const name        = document.getElementById('completion_tag_name').value.trim();
            const description = typeof CKEDITOR !== 'undefined' && CKEDITOR.instances['completion_tag_description']
                ? CKEDITOR.instances['completion_tag_description'].getData()
                : document.getElementById('completion_tag_description').value;

            // ─── Validation ────────────────────────────────────────────────
            if (!name) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Required!',
                    text: 'Please enter a name for the completion tag.',
                    confirmButtonColor: '#4c4b9e',
                });
                return;
            }

            // ─── Build payload ─────────────────────────────────────────────
            const fileInput = document.getElementById('completion_tag_imgFile');
            const file      = fileInput.files[0];

            if (file) {
                // ── With image → FormData ──────────────────────────────────
                const formData = new FormData();
                formData.append('name',        name);
                formData.append('description', description);
                formData.append('imgFile',     file);

                fetch(`/api/create_completion_tag/${ACCOUNT_ID}`, {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json())
                .then(handleCreateResponse)
                .catch(handleCreateError);

            } else {
                // ── Without image → JSON ───────────────────────────────────
                fetch(`/api/create_completion_tag/${ACCOUNT_ID}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description })
                })
                .then(res => res.json())
                .then(handleCreateResponse)
                .catch(handleCreateError);
            }
        });

        // ─── Helpers ───────────────────────────────────────────────────────
        function handleCreateResponse(data) {
            if (data.Message && data.Message.toLowerCase().includes('error')) {
                Swal.fire({
                    icon: 'error',
                    title: 'Oops!',
                    text: data.Message,
                    confirmButtonColor: '#4c4b9e',
                });
            } else {
                Swal.fire({
                    icon: 'success',
                    title: 'Success!',
                    text: 'Completion tag created successfully!',
                    confirmButtonColor: '#4c4b9e',
                }).then(() => {
                    window.location.href = '/dashboard/show-completion-tag';
                });
            }
        }

        function handleCreateError() {
            Swal.fire({
                icon: 'error',
                title: 'Server Error',
                text: 'Something went wrong, please try again.',
                confirmButtonColor: '#4c4b9e',
            });
        }

    });
</script>
