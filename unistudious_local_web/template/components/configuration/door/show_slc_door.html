<div class="content-body">
    <div class="container-fluid">
        <div class="row">
            <div class="col-xl-12">
                <div class="page-title flex-wrap">
                    <form id="searchForm" method="get" action="/dashboard/list-slc-door">
                        <div class="input-group search-area mb-3" style="width: 18.875rem;">
                            <input type="text" id="searchInput" class="form-control" placeholder="{{ t('search_here') }}"
                                   name="search_admin" value="">
                            <span class="input-group-text">
                                <a href="javascript:void(0)">
                                    <svg width="15" height="15" viewBox="0 0 18 18" fill="none"
                                         xmlns="http://www.w3.org/2000/svg">
                                        <path d="M17.5605 15.4395L13.7527 11.6317C14.5395 10.446 15 9.02625 15 7.5C15 3.3645 11.6355 0 7.5 0C3.3645 0 0 3.3645 0 7.5C0 11.6355 3.3645 15 7.5 15C9.02625 15 10.446 14.5395 11.6317 13.7527L15.4395 17.5605C16.0245 18.1462 16.9755 18.1462 17.5605 17.5605C18.1462 16.9747 18.1462 16.0252 17.5605 15.4395V15.4395ZM2.25 7.5C2.25 4.605 4.605 2.25 7.5 2.25C10.395 2.25 12.75 4.605 12.75 7.5C12.75 10.395 10.395 12.75 7.5 12.75C4.605 12.75 2.25 10.395 2.25 7.5V7.5Z"
                                              fill="#01A3FF"></path>
                                    </svg>
                                </a>
                            </span>
                        </div>
                    </form>
                    <div>
                        <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal"
                                data-bs-target="#adminNewSlcDoorModal">
                            {{ t('new_door') }}
                        </button>
                    </div>
                </div>

                <!-- Cards Row -->
                <div class="row" id="doorCardsContainer">

                    <!-- Static Door Card -->
                    <div class="col-xl-3 col-lg-4 col-sm-6">
                        <div class="card contact_list text-center">
                            <div class="card-body">
                                <div class="user-content">
                                    <div class="user-info">
                                        <div class="user-img">
                                            <img src="/assets/admin/images/door.png" alt="" class="avatar avatar-xl">
                                        </div>
                                        <div class="user-details">
                                            <h4 class="user-name mb-0">Door-1</h4>
                                            <p>Class Khalil</p>
                                        </div>
                                    </div>
                                    <div class="dropdown">
                                        <a href="javascript:void(0);" class="btn sharp" data-bs-toggle="dropdown"
                                           aria-expanded="false">
                                            <svg width="24" height="6" viewBox="0 0 24 6" fill="none"
                                                 xmlns="http://www.w3.org/2000/svg">
                                                <path d="M12.0012 0.359985C11.6543 0.359985 11.3109 0.428302 10.9904 0.561035C10.67 0.693767 10.3788 0.888317 10.1335 1.13358C9.88829 1.37883 9.69374 1.67 9.56101 1.99044C9.42828 2.31089 9.35996 2.65434 9.35996 3.00119C9.35996 3.34803 9.42828 3.69148 9.56101 4.01193C9.69374 4.33237 9.88829 4.62354 10.1335 4.8688C10.3788 5.11405 10.67 5.3086 10.9904 5.44134C11.3109 5.57407 11.6543 5.64239 12.0012 5.64239C12.7017 5.64223 13.3734 5.36381 13.8686 4.86837C14.3638 4.37294 14.6419 3.70108 14.6418 3.00059C14.6416 2.3001 14.3632 1.62836 13.8677 1.13315C13.3723 0.637942 12.7004 0.359826 12 0.359985H12.0012ZM3.60116 0.359985C3.25431 0.359985 2.91086 0.428302 2.59042 0.561035C2.26997 0.693767 1.97881 0.888317 1.73355 1.13358C1.48829 1.37883 1.29374 1.67 1.16101 1.99044C1.02828 2.31089 0.959961 2.65434 0.959961 3.00119C0.959961 3.34803 1.02828 3.69148 1.16101 4.01193C1.29374 4.33237 1.48829 4.62354 1.73355 4.8688C1.97881 5.11405 2.26997 5.3086 2.59042 5.44134C2.91086 5.57407 3.25431 5.64239 3.60116 5.64239C4.30165 5.64223 4.97339 5.36381 5.4686 4.86837C5.9638 4.37294 6.24192 3.70108 6.24176 3.00059C6.2416 2.3001 5.96318 1.62836 5.46775 1.13315C4.97231 0.637942 4.30045 0.359826 3.59996 0.359985H3.60116ZM20.4012 0.359985C20.0543 0.359985 19.7109 0.428302 19.3904 0.561035C19.07 0.693767 18.7788 0.888317 18.5336 1.13358C18.2883 1.37883 18.0937 1.67 17.961 1.99044C17.8283 2.31089 17.76 2.65434 17.76 3.00119C17.76 3.34803 17.8283 3.69148 17.961 4.01193C18.0937 4.33237 18.2883 4.62354 18.5336 4.8688C18.7788 5.11405 19.07 5.3086 19.3904 5.44134C19.7109 5.57407 20.0543 5.64239 20.4012 5.64239C21.1017 5.64223 21.7734 5.36381 22.2686 4.86837C22.7638 4.37294 23.0419 3.70108 23.0418 3.00059C23.0416 2.3001 22.7632 1.62836 22.2677 1.13315C21.7723 0.637942 21.1005 0.359826 20.4 0.359985H20.4012Z"
                                                      fill="#A098AE"></path>
                                            </svg>
                                        </a>
                                        <div class="dropdown-menu dropdown-menu-end">
                                            <a data-id="1" id="delete-slc-door" class="dropdown-item">Delete</a>
                                            <a href="#" class="dropdown-item open-edit-slc-door-modal"
                                               data-id="1"
                                               data-name="Door-1"
                                               data-mac="AA:BB:CC:DD:EE:FF"
                                               data-room="Class Khalil"
                                               data-local="local hammam lif">
                                                Edit
                                            </a>
                                        </div>
                                    </div>
                                </div>
                                <div class="contact-icon">
                                    <span class="badge badge-primary light">MAC : AA:BB:CC:DD:EE:FF</span>
                                    <span class="badge badge-success light">Local : local hammam lif</span>
                                </div>
                                <div class="d-flex align-items-center mt-2">
                                    <a href="#" class="btn btn-primary btn-sm w-50 me-2 btn-status-slc-door" data-id="1"
                                       data-status="Active">
                                        <i class="fas fa-circle-check me-2"></i>Status
                                    </a>
                                    <a href="#" class="btn btn-sm w-50 btn-details-slc-door"
                                       data-id="1"
                                       data-name="Door-1"
                                       data-mac="AA:BB:CC:DD:EE:FF"
                                       data-room="Class Khalil"
                                       data-local="local hammam lif">
                                        <i class="fas fa-file-alt me-2"></i>Details
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Pagination -->
                <div class="row">
                    <div class="table-pagenation teach">
                        <small></small>
                        <nav>
                            <div class="row">
                                <div class="col-md-12">
                                    <div class="pagination"></div>
                                </div>
                            </div>
                        </nav>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- New Door Modal -->
<div class="modal fade" id="adminNewSlcDoorModal" tabindex="-1" aria-hidden="true" data-account-id="{{ account_id }}">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="slcDoorForm" data-locked="0">
                <input type="hidden" id="account-id" value="3">

                <div class="modal-header">
                    <h1 class="modal-title fs-5">{{ t('door_details') }}</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <div class="row">
                        <div class="col-xl-12">
                            <div class="mb-3">
                                <label class="form-label">{{ t('mac_id') }}</label>
                                <input type="text" class="form-control" id="doorMacId" name="macId" required>
                            </div>
                        </div>
                        <div class="col-xl-6">
                            <div class="mb-3">
                                <label class="form-label">{{ t('local') }}</label>
                                <select class="form-control" id="doorSlcLocal" name="slcLocal" required>
                                    <option value="">{{ t('select_local') }}</option>
                                    <option name="localId" value="8">local hammam lif</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">{{ t('door_name') }}</label>
                                <input type="text" class="form-control" id="doorName" name="name" required>
                            </div>
                        </div>
                        <div class="col-xl-6">
                            <div class="mb-3">
                                <label class="form-label">{{ t('room') }}</label>
                                <select class="form-control" id="doorRoomId" name="roomId" required>
                                    <option value="">{{ t('select_room') }}</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">{{ t('password') }}</label>
                                <input type="text" class="form-control" id="doorPassword" name="password">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-danger light" data-bs-dismiss="modal">{{ t('close') }}</button>
                    <button type="submit" class="btn btn-primary">{{ t('save_door') }}</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Door Modal -->
<div class="modal fade" id="editSlcDoorModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="editSlcDoorForm">
                <div class="modal-header">
                    <h5 class="modal-title">{{ t('edit_door') }}</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editDoorId">
                    <div class="mb-3">
                        <label class="form-label">{{ t('name') }}</label>
                        <input type="text" class="form-control" id="editDoorName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ t('mac_id') }}</label>
                        <input type="text" class="form-control" id="editDoorMac" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ t('password') }}</label>
                        <input type="text" class="form-control" id="editDoorPassword">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger light" data-bs-dismiss="modal">{{ t('close') }}</button>
                    <button type="submit" class="btn btn-primary">{{ t('save_changes') }}</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

    // ─── Load & Render Door Cards ───────────────────────────────────────────────
    function loadDoorCards() {
        fetch('/api/get_all_doors')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('doorCardsContainer');
                container.innerHTML = '';

                if (!Array.isArray(data) || data.length === 0) {
                    container.innerHTML = '<div class="col-12 text-center text-muted py-4">No doors found.</div>';
                    return;
                }

                data.forEach(door => {
                    const isOpen    = door.oc == 1;
                    const statusBtn = isOpen
                        ? `<a href="javascript:void(0);" class="btn btn-success btn-sm w-50 me-2 btn-status-slc-door" data-id="${door.id}" data-oc="${door.oc}">
                               <i class="fas fa-door-open me-2"></i>Open
                           </a>`
                        : `<a href="javascript:void(0);" class="btn btn-sm w-50 me-2 btn-status-slc-door
                                                      btn-outline-danger" data-id="${door.id}" data-oc="${door.oc}">
                               <i class="fas fa-door-closed me-2"></i>Closed
                           </a>`;

                    const card = `
                        <div class="col-xl-3 col-lg-4 col-sm-6">
                            <div class="card contact_list text-center">
                                <div class="card-body">
                                    <div class="user-content">
                                        <div class="user-info">
                                            <div class="user-img">
                                                <img src="../static/assets/images/door.jpg" alt=""
                                                     class="avatar avatar-xl rounded-circle"
                                                     onerror="this.src='/assets/admin/images/default.png'">
                                            </div>
                                            <div class="user-details">
                                                <h4 class="user-name mb-0">${door.name}</h4>
                                                <p class="text-muted">${door.room_name ?? 'Room #' + (door.roomId ?? '—')}</p>
                                            </div>
                                        </div>
                                        <div class="dropdown">
                                            <a href="javascript:void(0);" class="btn sharp" data-bs-toggle="dropdown" aria-expanded="false">
                                                <svg width="24" height="6" viewBox="0 0 24 6" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                    <path d="M12.0012 0.359985C11.6543 0.359985 11.3109 0.428302 10.9904 0.561035C10.67 0.693767 10.3788 0.888317 10.1335 1.13358C9.88829 1.37883 9.69374 1.67 9.56101 1.99044C9.42828 2.31089 9.35996 2.65434 9.35996 3.00119C9.35996 3.34803 9.42828 3.69148 9.56101 4.01193C9.69374 4.33237 9.88829 4.62354 10.1335 4.8688C10.3788 5.11405 10.67 5.3086 10.9904 5.44134C11.3109 5.57407 11.6543 5.64239 12.0012 5.64239C12.7017 5.64223 13.3734 5.36381 13.8686 4.86837C14.3638 4.37294 14.6419 3.70108 14.6418 3.00059C14.6416 2.3001 14.3632 1.62836 13.8677 1.13315C13.3723 0.637942 12.7004 0.359826 12 0.359985H12.0012ZM3.60116 0.359985C3.25431 0.359985 2.91086 0.428302 2.59042 0.561035C2.26997 0.693767 1.97881 0.888317 1.73355 1.13358C1.48829 1.37883 1.29374 1.67 1.16101 1.99044C1.02828 2.31089 0.959961 2.65434 0.959961 3.00119C0.959961 3.34803 1.02828 3.69148 1.16101 4.01193C1.29374 4.33237 1.48829 4.62354 1.73355 4.8688C1.97881 5.11405 2.26997 5.3086 2.59042 5.44134C2.91086 5.57407 3.25431 5.64239 3.60116 5.64239C4.30165 5.64223 4.97339 5.36381 5.4686 4.86837C5.9638 4.37294 6.24192 3.70108 6.24176 3.00059C6.2416 2.3001 5.96318 1.62836 5.46775 1.13315C4.97231 0.637942 4.30045 0.359826 3.59996 0.359985H3.60116ZM20.4012 0.359985C20.0543 0.359985 19.7109 0.428302 19.3904 0.561035C19.07 0.693767 18.7788 0.888317 18.5336 1.13358C18.2883 1.37883 18.0937 1.67 17.961 1.99044C17.8283 2.31089 17.76 2.65434 17.76 3.00119C17.76 3.34803 17.8283 3.69148 17.961 4.01193C18.0937 4.33237 18.2883 4.62354 18.5336 4.8688C18.7788 5.11405 19.07 5.3086 19.3904 5.44134C19.7109 5.57407 20.0543 5.64239 20.4012 5.64239C21.1017 5.64223 21.7734 5.36381 22.2686 4.86837C22.7638 4.37294 23.0419 3.70108 23.0418 3.00059C23.0416 2.3001 22.7632 1.62836 22.2677 1.13315C21.7723 0.637942 21.1005 0.359826 20.4 0.359985H20.4012Z" fill="#A098AE"></path>
                                                </svg>
                                            </a>
                                            <div class="dropdown-menu dropdown-menu-end">
                                                <a class="dropdown-item delete-slc-door" href="javascript:void(0);" data-id="${door.id}">Delete</a>
                                                <a href="javascript:void(0);" class="dropdown-item open-edit-slc-door-modal"
                                                   data-id="${door.id}"
                                                   data-name="${door.name}"
                                                   data-mac="${door.mac}">
                                                    Edit
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="contact-icon mt-2">
                                        <span class="badge badge-success light">Local : ${door.local_name ?? '—'}</span>
                                    </div>
                                    <div class="d-flex align-items-center mt-3">
                                        ${statusBtn}
                                        <a href="javascript:void(0);" class="btn btn-outline-secondary btn-sm w-50 btn-details-slc-door"
                                           data-id="${door.id}"
                                           data-name="${door.name}"
                                           data-mac="${door.mac}"
                                           data-room="${door.roomId ?? ''}"
                                           data-oc="${door.oc}">
                                            <i class="fas fa-file-alt me-2"></i>Details
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', card);
                });
            })
            .catch(err => {
                console.error('Error loading doors:', err);
                document.getElementById('doorCardsContainer').innerHTML =
                    '<div class="col-12 text-center text-danger py-4">Failed to load doors.</div>';
            });
    }

    // ─── New Door Modal ──────────────────────────────────────────────────────────
    const modal = document.getElementById('adminNewSlcDoorModal');

    if (modal) {
        modal.addEventListener('show.bs.modal', function () {
            const accountId = modal.getAttribute('data-account-id');

            fetch('/api/get_room')
                .then(res => res.json())
                .then(data => {
                    const select = document.getElementById('doorRoomId');
                    select.innerHTML = '<option value="">Select Room</option>';
                    if (data.success && data.data) {
                        data.data.forEach(room => {
                            const option = document.createElement('option');
                            option.value = room.id;
                            option.textContent = room.name;
                            select.appendChild(option);
                        });
                    }
                })
                .catch(err => console.error('Error loading rooms:', err));

            fetch(`/api/get-local-info/${accountId}`)
                .then(res => res.json())
                .then(data => {
                    const select = document.getElementById('doorSlcLocal');
                    select.innerHTML = '<option value="">Select Local</option>';
                    if (data.Data && data.Data.length > 0) {
                        data.Data.forEach(local => {
                            const option = document.createElement('option');
                            option.value = local.id;
                            option.textContent = local.name;
                            select.appendChild(option);
                        });
                    }
                })
                .catch(err => console.error('Error loading locals:', err));
        });

        document.getElementById('slcDoorForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const payload = {
                mac_id:   document.getElementById('doorMacId').value,
                slc_id:   document.getElementById('doorSlcLocal').value,
                name:     document.getElementById('doorName').value,
                room_id:  document.getElementById('doorRoomId').value,
                password: document.getElementById('doorPassword').value,
            };

            fetch('/api/create_door', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.Message === 'Succes in creating door') {
                    Swal.fire({ icon: 'success', title: 'Success', text: 'Door created successfully!' })
                        .then(() => {
                            bootstrap.Modal.getInstance(modal).hide();
                            document.getElementById('slcDoorForm').reset();
                            loadDoorCards();
                        });
                } else {
                    Swal.fire({ icon: 'error', title: 'Error', text: data.Message });
                }
            })
            .catch(err => {
                console.error('Error creating door:', err);
                Swal.fire({ icon: 'error', title: 'Error', text: 'Something went wrong!' });
            });
        });
    }

    // ─── Edit Door Modal ─────────────────────────────────────────────────────────
    const editDoorModalEl = document.getElementById('editSlcDoorModal');
    const editDoorModal   = editDoorModalEl ? new bootstrap.Modal(editDoorModalEl) : null;

    const editSlcDoorForm = document.getElementById('editSlcDoorForm');
    if (editSlcDoorForm) {
        editSlcDoorForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const payload = {
                id:       document.getElementById('editDoorId').value,
                name:     document.getElementById('editDoorName').value,
                mac_id:   document.getElementById('editDoorMac').value,
                password: document.getElementById('editDoorPassword').value,
            };

            fetch(`/api/update_door/${payload.id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.Message === 'Success in updating door') {
                    Swal.fire({ icon: 'success', title: 'Updated', text: 'Door updated successfully!' })
                        .then(() => {
                            editDoorModal.hide();
                            loadDoorCards();
                        });
                } else {
                    Swal.fire({ icon: 'error', title: 'Error', text: data.Message });
                }
            })
            .catch(err => {
                console.error('Update error:', err);
                Swal.fire({ icon: 'error', title: 'Error', text: 'Something went wrong!' });
            });
        });
    }

    // ─── Edit + Delete (single delegated listener) ───────────────────────────────
    const cardsContainer = document.getElementById('doorCardsContainer');
    if (cardsContainer) {
        cardsContainer.addEventListener('click', function (e) {

            // Edit
            const editBtn = e.target.closest('.open-edit-slc-door-modal');
            if (editBtn) {
                document.getElementById('editDoorId').value       = editBtn.getAttribute('data-id');
                document.getElementById('editDoorName').value     = editBtn.getAttribute('data-name');
                document.getElementById('editDoorMac').value      = editBtn.getAttribute('data-mac');
                document.getElementById('editDoorPassword').value = '';
                if (editDoorModal) editDoorModal.show();
                return;
            }

            // Delete
            const deleteBtn = e.target.closest('.delete-slc-door');
            if (deleteBtn) {
                const doorId = deleteBtn.getAttribute('data-id');
                Swal.fire({
                    title: 'Delete this door?',
                    text: 'This action cannot be undone.',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'Yes, delete it'
                }).then(result => {
                    if (!result.isConfirmed) return;
                    fetch(`/api/delete_door/${doorId}`, { method: 'POST' })
                        .then(res => res.json())
                        .then(() => {
                            Swal.fire({ icon: 'success', title: 'Deleted', text: 'Door removed.' });
                            loadDoorCards();
                        })
                        .catch(err => {
                            console.error('Delete error:', err);
                            Swal.fire({ icon: 'error', title: 'Error', text: 'Could not delete door.' });
                        });
                });
            }

        });
    }

    // ─── Init ────────────────────────────────────────────────────────────────────
    loadDoorCards();

}); // end DOMContentLoaded
</script>
