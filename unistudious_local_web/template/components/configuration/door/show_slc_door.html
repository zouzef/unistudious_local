<!-- New Door Modal -->
<div class="modal fade" id="adminNewSlcDoorModal" tabindex="-1" aria-hidden="true" data-account-id="{{ account_id }}">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="slcDoorForm" data-locked="0">
                <input type="hidden" id="account-id" value="3">

                <div class="modal-header">
                    <h1 class="modal-title fs-5">Door Details</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <div class="row">
                        <div class="col-xl-12">
                            <div class="mb-3">
                                <label class="form-label">MAC ID</label>
                                <input type="text" class="form-control" id="doorMacId" name="macId" required>
                            </div>
                        </div>
                        <div class="col-xl-6">
                            <div class="mb-3">
                                <label class="form-label">Local</label>
                                <select class="form-control" id="doorSlcLocal" name="slcLocal" required>
                                    <option value="">Select Local</option>
                                    <option name="localId" value="8">local hammam lif</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Door Name</label>
                                <input type="text" class="form-control" id="doorName" name="name" required>
                            </div>
                        </div>
                        <div class="col-xl-6">
                            <div class="mb-3">
                                <label class="form-label">Room</label>
                                <select class="form-control" id="doorRoomId" name="roomId" required>
                                    <option value="">Select Room</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="text" class="form-control" id="doorPassword" name="password">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-danger light" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Save Door</button>
                </div>
            </form>
        </div>
    </div>
</div>


<script>
    const modal = document.getElementById('adminNewSlcDoorModal');

  if (modal) {
      modal.addEventListener('show.bs.modal', function () {
          const accountId = modal.getAttribute('data-account-id');

          // Load Rooms
          fetch('/api/get_room')
              .then(res => res.json())
              .then(data => {
                  const select = document.getElementById('doorRoomId');
                  select.innerHTML = '<option value="">Select Room</option>';
                  if (data.success && data.data) {
                      data.data.forEach(room => {
                          const option = document.createElement('option');
                          option.value = room.id;
                          option.textContent = room.name;
                          select.appendChild(option);
                      });
                  }
              })
              .catch(err => console.error('Error loading rooms:', err));

          // Load Locals
          fetch(`/api/get-local-info/${accountId}`)
              .then(res => res.json())
              .then(data => {
                  const select = document.getElementById('doorSlcLocal');
                  select.innerHTML = '<option value="">Select Local</option>';
                  if (data.Data && data.Data.length > 0) {
                      data.Data.forEach(local => {
                          const option = document.createElement('option');
                          option.value = local.id;
                          option.textContent = local.name;
                          select.appendChild(option);
                      });
                  }
              })
              .catch(err => console.error('Error loading locals:', err));
      });

      // Submit Form
      document.getElementById('slcDoorForm').addEventListener('submit', function (e) {
          e.preventDefault();

            const payload = {
                mac_id:   document.getElementById('doorMacId').value,
                slc_id:   document.getElementById('doorSlcLocal').value,
                name:     document.getElementById('doorName').value,
                room_id:  document.getElementById('doorRoomId').value,
                password: document.getElementById('doorPassword').value,
            };

          fetch('/api/create_door', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
          })
          .then(res => res.json())
          .then(data => {
              if (data.Message === 'Succes in creating door') {
                  Swal.fire({
                      icon: 'success',
                      title: 'Success',
                      text: 'Door created successfully!'
                  }).then(() => {
                      bootstrap.Modal.getInstance(modal).hide();
                      document.getElementById('slcDoorForm').reset();
                  });
              } else {
                  Swal.fire({
                      icon: 'error',
                      title: 'Error',
                      text: data.Message
                  });
              }
          })
          .catch(err => {
              console.error('Error creating door:', err);
              Swal.fire({
                  icon: 'error',
                  title: 'Error',
                  text: 'Something went wrong!'
              });
          });
      });
  }
</script>
