<div class="content-body">
    <div class="container-fluid">

        <div class="row">
            <div class="card-header">
                <h4 class="card-title">Add New Formation</h4>
            </div>

            <form id="formation-form" enctype="multipart/form-data">

                <!-- ═══════════════════════════════════════════════════════ -->
                <!--  FORMATION DETAILS                                      -->
                <!-- ═══════════════════════════════════════════════════════ -->
                <div class="col-xl-12">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">Formation Details</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">

                                <!-- Image -->
                                <div class="col-xl-3 col-sm-4">
                                    <div class="card card-bx profile-card author-profile m-b30">
                                        <div class="card-body">
                                            <div class="p-5">
                                                <div class="author-profile">
                                                    <div class="author-media-formation">
                                                        <img id="imagePreview"
                                                             src="/assets/admin/images/formation-empty.jpg"
                                                             alt="">
                                                    </div>
                                                    <div class="change-btn mt-5 mb-lg-0 mb-3">
                                                        <input type="file" id="formation_logoFile"
                                                               name="formation[logoFile]"
                                                               class="d-none"
                                                               accept=".png, .jpg, .jpeg">
                                                        <label for="formation_logoFile"
                                                               class="dlab-upload mb-0 btn btn-primary btn-sm">
                                                            Choose File
                                                        </label>
                                                        <a href="javascript:void(0);"
                                                           class="btn btn-danger light remove-img ms-2 btn-sm"
                                                           id="remove-img">Remove</a>
                                                    </div>
                                                    <hr class="mb-4 mt-4">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Fields -->
                                <div class="col-xl-9 col-sm-8">

                                    <!-- Name -->
                                    <div class="mb-3">
                                        <label class="form-label text-primary d-block" for="formation_name">
                                            Name <code class="highlighter-rouge">*</code>
                                        </label>
                                        <input type="text" id="formation_name" name="formation[name]"
                                               required class="form-control">
                                    </div>

                                    <!-- Status -->
                                    <div class="mb-3">
                                        <label class="form-label text-primary d-block" for="formation_status">
                                            Status <code class="highlighter-rouge">*</code>
                                        </label>
                                        <select id="formation_status" name="formation[status]"
                                                class="form-control selectpicker">
                                            <option value="1">Active</option>
                                            <option value="0">Inactive</option>
                                        </select>
                                    </div>

                                    <hr class="mb-4 mt-4">

                                    <!-- Level -->
                                    <div class="mb-3">
                                        <label class="form-label text-primary d-block" for="formation_accountLevel">
                                            Level
                                        </label>
                                        <select id="formation_accountLevel" name="formation[accountLevel]"
                                                class="form-control selectpicker" aria-label="Level">
                                            <option value="">Choose the Level...</option>
                                        </select>
                                    </div>

                                    <!-- Section -->
                                    <div class="mb-3">
                                        <label class="form-label text-primary d-block" for="formation_accountSection">
                                            Section
                                        </label>
                                        <select id="formation_accountSection" name="formation[accountSection]"
                                                class="form-control selectpicker" aria-label="Section">
                                            <option value="">Choose the Section...</option>
                                        </select>
                                    </div>

                                    <hr class="mb-4 mt-4">

                                    <!-- Date and Session Analytics -->
                                    <div class="mb-3">
                                        <label class="form-label text-primary d-block" for="formation_typeDate">
                                            Date and Session Analytics <code class="highlighter-rouge">*</code>
                                        </label>
                                        <select id="formation_typeDate" name="formation[typeDate]"
                                                required class="form-control selectpicker">
                                            <option value="">Choice Date and Session Analytics...</option>
                                            <option value="total Duration">Total Duration per day</option>
                                            <option value="By Number Of Sessions">Number Of Sessions per hours</option>
                                        </select>
                                    </div>

                                    <!-- Other Date (conditional) -->
                                    <div class="mb-3" id="div-other-title-date" style="display: none;">
                                        <label class="form-label text-primary d-block" for="formation_otherTypeDate">
                                            Other Date and Session Analytics <code class="highlighter-rouge">*</code>
                                        </label>
                                        <input type="text" id="formation_otherTypeDate"
                                               name="formation[otherTypeDate]" class="form-control">
                                    </div>

                                    <!-- Duration by Days (conditional) -->
                                    <div class="mb-3" id="div-duration-day" style="display: none;">
                                        <label class="form-label text-primary d-block"
                                               for="formation_numberDayDuration">
                                            Duration by Number of Days <code class="highlighter-rouge">*</code>
                                        </label>
                                        <input type="text" id="formation_numberDayDuration"
                                               name="formation[numberDayDuration]"
                                               class="form-control" inputmode="decimal">
                                    </div>

                                    <!-- Duration by Sessions (conditional) -->
                                    <div class="mb-3" id="div-duration-session" style="display: none;">
                                        <label class="form-label text-primary d-block" for="formation_numberSession">
                                            Duration by Number of Sessions <code class="highlighter-rouge">*</code>
                                        </label>
                                        <input type="text" id="formation_numberSession"
                                               name="formation[numberSession]"
                                               class="form-control" inputmode="decimal">
                                    </div>

                                    <hr class="mb-4 mt-4">

                                    <!-- Session Modes -->
                                    <div class="mb-3">
                                        <label class="form-label text-primary d-block" for="formation_typeSession">
                                            Session Modes Analysis <code class="highlighter-rouge">*</code>
                                        </label>
                                        <select id="formation_typeSession" name="formation[typeSession]"
                                                required class="form-control selectpicker">
                                            <option value="">Choice Session Modes Analysis...</option>
                                            <option value="O">Online</option>
                                            <option value="P">Presence</option>
                                            <option value="M">Mixed</option>
                                        </select>
                                    </div>

                                    <!-- Other Session Mode (conditional) -->
                                    <div class="mb-3" id="div-other-title-session" style="display: none;">
                                        <label class="form-label text-primary d-block" for="formation_otherTypeSession">
                                            Other Session Modes Analysis <code class="highlighter-rouge">*</code>
                                        </label>
                                        <input type="text" id="formation_otherTypeSession"
                                               name="formation[otherTypeSession]" class="form-control">
                                    </div>

                                    <hr class="mb-4 mt-4">

                                    <!-- Passage Conditions -->
                                    <div class="mb-3">
                                        <label class="form-label text-primary d-block"
                                               for="formation_conditionOfPassage">
                                            Passage Conditions and Criteria <code class="highlighter-rouge">*</code>
                                        </label>
                                        <select id="formation_conditionOfPassage" name="formation[conditionOfPassage]"
                                                required class="form-control selectpicker">
                                            <option value="">Choice Passage Conditions and Criteria...</option>
                                            <option value="Auto">Auto</option>
                                            <option value="Decision">Decision</option>
                                            <option value="Formula">Formula</option>
                                        </select>
                                    </div>

                                    <!-- Passage Formula (conditional) -->
                                    <div class="mb-3" id="div-formulas-passage" style="display: none;">
                                        <label class="form-label text-primary d-block"
                                               for="formation_conditionOfPassageFormule">
                                            Formulas for Passage Conditions <code class="highlighter-rouge">*</code>
                                        </label>
                                        <select id="formation_conditionOfPassageFormule"
                                                name="formation[conditionOfPassageFormule]"
                                                class="form-control selectpicker">
                                            <option value="">Choice Formulas for Passage Conditions...</option>
                                            <option value="Score">Score</option>
                                            <option value="Present">Present</option>
                                            <option value="Note And Presence">Note And Presence</option>
                                        </select>
                                    </div>

                                    <!-- By Score (conditional) -->
                                    <div class="mb-3" id="div-passage-score" style="display: none;">
                                        <label class="form-label text-primary d-block"
                                               for="formation_conditionOfPassageFormuleByNote">
                                            Passage Requirements by Score <code class="highlighter-rouge">*</code>
                                        </label>
                                        <input type="text" id="formation_conditionOfPassageFormuleByNote"
                                               name="formation[conditionOfPassageFormuleByNote]" class="form-control">
                                    </div>

                                    <!-- By Presence (conditional) -->
                                    <div class="mb-3" id="div-passage-present" style="display: none;">
                                        <label class="form-label text-primary d-block"
                                               for="formation_conditionOfPassageFormuleByPresent">
                                            Passage Formulas by Presence <code class="highlighter-rouge">*</code>
                                        </label>
                                        <input type="text" id="formation_conditionOfPassageFormuleByPresent"
                                               name="formation[conditionOfPassageFormuleByPresent]"
                                               class="form-control">
                                    </div>

                                    <!-- By Score + Presence (conditional) -->
                                    <div class="mb-3" id="div-passage-note-present" style="display: none;">
                                        <label class="form-label text-primary d-block"
                                               for="formation_conditionOfPassageFormuleByNotePresent">
                                            Comprehensive Passage Criteria: Scores and Presence
                                            <code class="highlighter-rouge">*</code>
                                        </label>
                                        <input type="text" id="formation_conditionOfPassageFormuleByNotePresent"
                                               name="formation[conditionOfPassageFormuleByNotePresent]"
                                               class="form-control">
                                    </div>

                                    <hr class="mb-4 mt-4">

                                    <!-- Share Resource -->
                                    <div class="mb-3">
                                        <label class="form-label text-primary d-block" for="formation_publicResource">
                                            Share Resource
                                        </label>
                                        <select id="formation_publicResource" name="formation[publicResource]"
                                                class="form-control selectpicker">
                                            <option value="">Do you want to share your resource from the file manager?
                                            </option>
                                            <option value="1">Yes</option>
                                            <option value="0">No</option>
                                        </select>
                                    </div>

                                    <hr class="mb-4 mt-4">

                                    <!-- Description -->
                                    <div class="mb-3">
                                        <label class="form-label text-primary d-block" for="formation_description">
                                            Description
                                        </label>
                                        <textarea id="formation_description" name="formation[description]"
                                                  class="form-control" rows="7" data-ckeditor="true"></textarea>
                                    </div>

                                </div>


                            </div>
                            <div class="float-end">
                                <button class="btn btn-outline-primary me-3" id="create_formation">Create</button>
                                <a href="/dashboard/show-formation" class="btn btn-outline-danger">Close</a>
                            </div>
                        </div>
                    </div>
                </div>


            </form>
        </div>
    </div>
</div>

<script>
    const account_id = {{ account_id }};

    document.addEventListener('DOMContentLoaded', function () {

        // ────────────────────────────────────────────────────────────────
        // Load Levels and Sections from API
        // ────────────────────────────────────────────────────────────────
        Promise.all([
            fetch(`/api/get_all_account_level/${account_id}`).then(res => res.json()),
            fetch(`/api/get_all_account_section/${account_id}`).then(res => res.json()),
        ])
        .then(([levels, sections]) => {

            // ── Levels ───────────────────────────────────────────────
            const levelSelect  = document.getElementById('formation_accountLevel');
            levelSelect.innerHTML = '<option value="">Choose the Level...</option>';

            levels.forEach(level => {
                const option       = document.createElement('option');
                option.value       = level.id;
                option.textContent = level.other_level ? level.other_level : level.level_name;
                levelSelect.appendChild(option);
            });

            $('#formation_accountLevel').selectpicker('refresh');

            // ── Sections ─────────────────────────────────────────────
            const sectionSelect  = document.getElementById('formation_accountSection');
            sectionSelect.innerHTML = '<option value="">Choose the Section...</option>';

            sections.forEach(section => {
                const option       = document.createElement('option');
                option.value       = section.id;
                option.textContent = section.other_section ? section.other_section : section.section_name;
                sectionSelect.appendChild(option);
            });

            $('#formation_accountSection').selectpicker('refresh');
        })
        .catch(err => {
            console.error('Failed to load levels/sections:', err);
        });


        // ────────────────────────────────────────────────────────────────
        // Image Preview
        // ────────────────────────────────────────────────────────────────
        document.getElementById('formation_logoFile').addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById('imagePreview').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // ────────────────────────────────────────────────────────────────
        // Remove Image
        // ────────────────────────────────────────────────────────────────
        document.getElementById('remove-img').addEventListener('click', function () {
            document.getElementById('imagePreview').src = '/assets/admin/images/formation-empty.jpg';
            document.getElementById('formation_logoFile').value = '';
        });

        // ────────────────────────────────────────────────────────────────
        // Conditional Show/Hide — Type Date
        // ────────────────────────────────────────────────────────────────
        document.getElementById('formation_typeDate').addEventListener('change', function () {
            const val = this.value;

            document.getElementById('div-other-title-date').style.display = 'none';
            document.getElementById('div-duration-day').style.display     = 'none';
            document.getElementById('div-duration-session').style.display = 'none';

            if (val === 'total Duration') {
                document.getElementById('div-duration-day').style.display     = 'block';
            } else if (val === 'By Number Of Sessions') {
                document.getElementById('div-duration-session').style.display = 'block';
            } else if (val === 'other') {
                document.getElementById('div-other-title-date').style.display = 'block';
            }
        });

        // ────────────────────────────────────────────────────────────────
        // Conditional Show/Hide — Type Session
        // ────────────────────────────────────────────────────────────────
        document.getElementById('formation_typeSession').addEventListener('change', function () {
            const val = this.value;
            document.getElementById('div-other-title-session').style.display = (val === 'other') ? 'block' : 'none';
        });

        // ────────────────────────────────────────────────────────────────
        // Conditional Show/Hide — Condition Of Passage
        // ────────────────────────────────────────────────────────────────
        document.getElementById('formation_conditionOfPassage').addEventListener('change', function () {
            const val = this.value;

            document.getElementById('div-formulas-passage').style.display     = 'none';
            document.getElementById('div-passage-score').style.display        = 'none';
            document.getElementById('div-passage-present').style.display      = 'none';
            document.getElementById('div-passage-note-present').style.display = 'none';

            if (val === 'Formula') {
                document.getElementById('div-formulas-passage').style.display = 'block';
            }
        });

        // ────────────────────────────────────────────────────────────────
        // Conditional Show/Hide — Passage Formula
        // ────────────────────────────────────────────────────────────────
        document.getElementById('formation_conditionOfPassageFormule').addEventListener('change', function () {
            const val = this.value;

            document.getElementById('div-passage-score').style.display        = 'none';
            document.getElementById('div-passage-present').style.display      = 'none';
            document.getElementById('div-passage-note-present').style.display = 'none';

            if (val === 'Score') {
                document.getElementById('div-passage-score').style.display        = 'block';
            } else if (val === 'Present') {
                document.getElementById('div-passage-present').style.display      = 'block';
            } else if (val === 'Note And Presence') {
                document.getElementById('div-passage-note-present').style.display = 'block';
            }
        });

        // ────────────────────────────────────────────────────────────────
        // Submit
        // ────────────────────────────────────────────────────────────────
        document.getElementById('create_formation').addEventListener('click', async function (e) {
            e.preventDefault();

            // ── Validation ────────────────────────────────────────────
            if (!document.getElementById('formation_name').value.trim()) {
                return Swal.fire({ icon: 'warning', title: 'Required', text: 'Name is required.', confirmButtonColor: '#4c4b9e' });
            }
            if (!document.getElementById('formation_status').value) {
                return Swal.fire({ icon: 'warning', title: 'Required', text: 'Status is required.', confirmButtonColor: '#4c4b9e' });
            }
            if (!document.getElementById('formation_typeDate').value) {
                return Swal.fire({ icon: 'warning', title: 'Required', text: 'Date and Session Analytics is required.', confirmButtonColor: '#4c4b9e' });
            }
            if (!document.getElementById('formation_typeSession').value) {
                return Swal.fire({ icon: 'warning', title: 'Required', text: 'Session Modes Analysis is required.', confirmButtonColor: '#4c4b9e' });
            }
            if (!document.getElementById('formation_conditionOfPassage').value) {
                return Swal.fire({ icon: 'warning', title: 'Required', text: 'Passage Conditions is required.', confirmButtonColor: '#4c4b9e' });
            }

            // ── Build FormData ────────────────────────────────────────
            const formData = new FormData();

            // Image
            const fileInput = document.getElementById('formation_logoFile');
            if (fileInput.files[0]) {
                formData.append('formation_logoFile', fileInput.files[0]);
            }

            // Description (CKEditor or plain textarea)
            const description = (typeof CKEDITOR !== 'undefined' && CKEDITOR.instances['formation_description'])
                ? CKEDITOR.instances['formation_description'].getData()
                : document.getElementById('formation_description').value;

            // All fields
            formData.append('formation[name]',                                   document.getElementById('formation_name').value.trim());
            formData.append('formation[status]',                                 document.getElementById('formation_status').value);
            formData.append('formation[accountLevel]',                           document.getElementById('formation_accountLevel').value);
            formData.append('formation[accountSection]',                         document.getElementById('formation_accountSection').value);
            formData.append('formation[typeDate]',                               document.getElementById('formation_typeDate').value);
            formData.append('formation[otherTypeDate]',                          document.getElementById('formation_otherTypeDate').value);
            formData.append('formation[numberDayDuration]',                      document.getElementById('formation_numberDayDuration').value);
            formData.append('formation[numberSession]',                          document.getElementById('formation_numberSession').value);
            formData.append('formation[typeSession]',                            document.getElementById('formation_typeSession').value);
            formData.append('formation[otherTypeSession]',                       document.getElementById('formation_otherTypeSession').value);
            formData.append('formation[conditionOfPassage]',                     document.getElementById('formation_conditionOfPassage').value);
            formData.append('formation[conditionOfPassageFormule]',              document.getElementById('formation_conditionOfPassageFormule').value);
            formData.append('formation[conditionOfPassageFormuleByNote]',        document.getElementById('formation_conditionOfPassageFormuleByNote').value);
            formData.append('formation[conditionOfPassageFormuleByPresent]',     document.getElementById('formation_conditionOfPassageFormuleByPresent').value);
            formData.append('formation[conditionOfPassageFormuleByNotePresent]', document.getElementById('formation_conditionOfPassageFormuleByNotePresent').value);
            formData.append('formation[publicResource]',                         document.getElementById('formation_publicResource').value);
            formData.append('formation[description]',                            description);

            // ── Send ──────────────────────────────────────────────────
            try {
                const response = await fetch(`/api/create_formation/${account_id}`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Created',
                        text: 'Formation created successfully.',
                        confirmButtonColor: '#4c4b9e',
                    }).then(() => {
                        window.location.href = '/dashboard/show-formation';
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: result.Message || 'Failed to create formation.',
                        confirmButtonColor: '#4c4b9e',
                    });
                }

            } catch (err) {
                console.error('Create error:', err);
                Swal.fire({
                    icon: 'error',
                    title: 'Network Error',
                    text: 'Could not reach the server.',
                    confirmButtonColor: '#4c4b9e',
                });
            }
        });

    }); // end DOMContentLoaded
</script>
