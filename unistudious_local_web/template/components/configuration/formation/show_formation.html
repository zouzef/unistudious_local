<div class="content-body">
    <div class="container-fluid">
        <div class="row">
            <div class="col-xl-12">
                <div class="page-title flex-wrap">
                    <form id="searchForm" method="get" action="/dashboard/show-formation">
                        <div class="input-group search-area mb-3">
                            <input type="text" class="form-control" placeholder="{{ t('search_here') }}"
                                   name="search_formation" value="">
                            <span class="input-group-text">
                                <a href="javascript:void(0)">
                                    <svg width="15" height="15" viewBox="0 0 18 18" fill="none"
                                         xmlns="http://www.w3.org/2000/svg">
                                        <path d="M17.5605 15.4395L13.7527 11.6317C14.5395 10.446 15 9.02625 15 7.5C15 3.3645 11.6355 0 7.5 0C3.3645 0 0 3.3645 0 7.5C0 11.6355 3.3645 15 7.5 15C9.02625 15 10.446 14.5395 11.6317 13.7527L15.4395 17.5605C16.0245 18.1462 16.9755 18.1462 17.5605 17.5605C18.1462 16.9747 18.1462 16.0252 17.5605 15.4395V15.4395ZM2.25 7.5C2.25 4.605 4.605 2.25 7.5 2.25C10.395 2.25 12.75 4.605 12.75 7.5C12.75 10.395 10.395 12.75 7.5 12.75C4.605 12.75 2.25 10.395 2.25 7.5V7.5Z"
                                              fill="#01A3FF"></path>
                                    </svg>
                                </a>
                            </span>
                        </div>
                    </form>
                    <a class="btn btn-outline-primary js-single-click" href="/dashboard/create-formation"><i
                            class="fa fa-plus me-1"></i>{{ t('Training Program') }}</a>
                </div>
            </div>

            <!-- Formation Cards Container -->
            <div class="row" id="formation-container">
                <!-- loaded dynamically -->
            </div>

        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        loadFormations();
    });

    function loadFormations() {
        fetch(`/api/get_all_formation/${ACCOUNT_ID}`)
            .then(res => res.json())
            .then(data => {
                const formations = Array.isArray(data) ? data : (data.Data || []);
                const container  = document.getElementById('formation-container');
                container.innerHTML = '';

                if (!formations || formations.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center mt-4">
                            <p class="text-muted">{{ t('no_formations_found') }}</p>
                        </div>`;
                    return;
                }

                formations.forEach(formation => {
                    const statusBadge = formation.status == 1
                        ? `<span class="badge badge-success light">{{ t('active') }}</span>`
                        : `<span class="badge badge-danger light">{{ t('inactive') }}</span>`;

                    const img = formation.img_link
                        ? `/api/get_formation_image/${formation.id}`
                        : '../static/assets/images/formation-empty.jpg';

                    const sessionsCount = formation.sessions_count ?? 0;
                    const level         = formation.level ?? '—';
                    const section       = formation.section ?? '—';
                    const createdAt     = formation.created_at ?? '—';
                    const description   = formation.description
                        ? formation.description
                        : '{{ t('no_description_available') }}';

                    const card = `
                        <div class="col-lg-12 col-xl-6 col-xxl-4 formation-card">
                            <div class="card">
                                <div class="card-body">
                                    <div class="row m-b-30">
                                        <div class="col-md-5 col-xxl-12">
                                            <div class="new-arrival-product mb-4 mb-xxl-4 mb-md-0">
                                                <div class="new-arrivals-img-contnent">
                                                    <img class="img-fluid" src="${img}" alt="formation" onerror="this.onerror=null;this.src='../static/assets/images/formation-empty.jpg';">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-7 col-xxl-12">
                                            <div class="new-arrival-content position-relative">
                                                <h4>
                                                    <a href="/dashboard/view_formation/${formation.id}">
                                                        ${formation.name} <i class="fa-solid fa-pen-to-square me-1"></i>
                                                    </a>
                                                </h4>
                                                <a href="/dashboard/view_formation/${formation.id}">
                                                    <div class="comment-review star-rating">
                                                        <span class="review-text">
                                                            (${sessionsCount} {{ t('sessions') }})
                                                        </span>
                                                    </div>
                                                    <p>
                                                        <span class="item fs-14">
                                                            {{ t('status') }}:
                                                        </span>
                                                        ${statusBadge}
                                                    </p>
                                                    <p>
                                                        <span class="item fs-14">
                                                            {{ t('education_level') }}
                                                        </span>
                                                        ${level}
                                                    </p>
                                                    <p>
                                                        <span class="item fs-14">
                                                            {{ t('education_section') }}
                                                        </span>
                                                        ${section}
                                                    </p>
                                                    <p>
                                                        <span class="item fs-14">
                                                            {{ t('created') }}
                                                        </span>
                                                        ${createdAt}
                                                    </p>
                                                    <p class="text-content">
                                                        ${description}
                                                    </p>
                                                </a>
                                                <div class="d-flex gap-2 mt-3">
                                                    <a href="/dashboard/view_formation/${formation.id}" class="btn btn-outline-info btn-sm w-50 js-single-click" data-locked="0">
                                                        <i class="fa-solid fa-edit me-2"></i>
                                                        {{ t('edit') }}
                                                    </a>
                                                    <button data-id="${formation.id}" class="btn btn-outline-danger btn-sm w-50 delete-formation">
                                                        <i class="fa-solid fa-trash me-2"></i>
                                                        {{ t('delete') }}
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>`;

                    container.insertAdjacentHTML('beforeend', card);
                });
            })
            .catch(err => {
                console.error('Failed to load formations:', err);
                Swal.fire({
                    icon: 'error',
                    title: '{{ t('error') }}',
                    text: '{{ t('failed_to_load_formations') }}',
                    confirmButtonColor: '#4c4b9e',
                });
            });
    }

    // ─── Delete handler (event delegation) ─────────────────────────────
    document.addEventListener('click', function (e) {
        const btn = e.target.closest('.delete-formation');
        if (!btn) return;

        const formationId = btn.dataset.id;

        Swal.fire({
            title: '{{ t('are_you_sure') }}',
            text: '{{ t('formation_delete_warning') }}',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#4c4b9e',
            confirmButtonText: '{{ t('yes_delete') }}',
            cancelButtonText: '{{ t('cancel') }}'
        }).then(result => {
            if (result.isConfirmed) {
                fetch(`/api/delete_formation/${ACCOUNT_ID}/${formationId}`, { method: 'POST' })
                    .then(res => res.json())
                    .then(data => {
                        Swal.fire({
                            icon: 'success',
                            title: '{{ t('deleted') }}',
                            text: '{{ t('formation_deleted_success') }}',
                            confirmButtonColor: '#4c4b9e',
                        }).then(() => loadFormations());
                    })
                    .catch(err => {
                        Swal.fire({
                            icon: 'error',
                            title: '{{ t('error') }}',
                            text: '{{ t('failed_to_delete_formation') }}',
                            confirmButtonColor: '#4c4b9e',
                        });
                    });
            }
        });
    });

</script>
