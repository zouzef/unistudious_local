<script>
    const account_id   = {{ account_id }};
    const FORMATION_ID = {{ formation_id }};

    document.addEventListener('DOMContentLoaded', function () {

        Promise.all([
            fetch(`/api/get_all_account_level/${account_id}`).then(res => res.json()),
            fetch(`/api/get_all_account_section/${account_id}`).then(res => res.json()),
            fetch(`/api/view_formation/${FORMATION_ID}`).then(res => res.json())
        ])
        .then(([levels, sections, formationArr]) => {
            console.log("levels:", levels);
            console.log("sections:", sections);
            console.log("formationArr:", formationArr);


            const formation = formationArr[0];

            console.log('FORMATION DATA:', formation);

            // ────────────────────────────────────────────────────────────────
            // Load Levels
            // ────────────────────────────────────────────────────────────────
            const levelSelect = document.getElementById('formation_accountLevel');

            levelSelect.innerHTML = '';

            levels.forEach(level => {

                const option = document.createElement('option');

                option.value = level.id;
                option.textContent = level.other_level
                    ? level.other_level
                    : level.level_name;

                if (level.level_name == formation.level_name) {
                    option.selected = true;
                }

                levelSelect.appendChild(option);
            });

            $('#formation_accountLevel').selectpicker('refresh');


            // ────────────────────────────────────────────────────────────────
            // Load Sections
            // ────────────────────────────────────────────────────────────────
            const sectionSelect = document.getElementById('formation_accountSection');

            sectionSelect.innerHTML = '';

            sections.forEach(section => {

                const option = document.createElement('option');

                option.value = section.id;
                option.textContent = section.other_section
                    ? section.other_section
                    : section.section_name;

                if (String(section.id) === String(formation.account_section_id)) {
                    option.selected = true;
                }

                sectionSelect.appendChild(option);
            });

            $('#formation_accountSection').selectpicker('refresh');


            // ────────────────────────────────────────────────────────────────
            // Name
            // ────────────────────────────────────────────────────────────────
            document.getElementById('formation_name').value =
                formation.name ?? '';


            // ────────────────────────────────────────────────────────────────
            // Status
            // ────────────────────────────────────────────────────────────────
            $('#formation_status')
                .val((formation.status ?? '').toString().trim())
                .selectpicker('refresh');


            // ────────────────────────────────────────────────────────────────
            // Type Date
            // ────────────────────────────────────────────────────────────────
            $('#formation_typeDate')
                .val((formation.type_date ?? '').toString().trim())
                .selectpicker('refresh');


            // ────────────────────────────────────────────────────────────────
            // Number Session / Day Duration
            // ────────────────────────────────────────────────────────────────
            if (formation.number_session) {

                document.getElementById('formation_numberSession').value =
                    formation.number_session;

                document.getElementById('div-duration-session').style.display =
                    'block';
            }

            if (formation.number_day_duration) {

                document.getElementById('formation_numberDayDuration').value =
                    formation.number_day_duration;

                document.getElementById('div-duration-day').style.display =
                    'block';
            }


            // ────────────────────────────────────────────────────────────────
            // Type Session
            // ────────────────────────────────────────────────────────────────
            console.log('TYPE SESSION:', formation.type_session);

            let typeSessionValue = '';

            switch ((formation.type_session || '').trim()) {

                case 'Online':
                    typeSessionValue = 'O';
                    break;

                case 'Presence':
                    typeSessionValue = 'P';
                    break;

                case 'Mixed':
                    typeSessionValue = 'M';
                    break;

                default:
                    typeSessionValue = formation.type_session;
            }

            $('#formation_typeSession')
                .val(typeSessionValue)
                .selectpicker('refresh');


            // ────────────────────────────────────────────────────────────────
            // Condition Of Passage
            // ────────────────────────────────────────────────────────────────
            $('#formation_conditionOfPassage')
                .val((formation.condition_of_passage ?? '').toString().trim())
                .selectpicker('refresh');


            // ────────────────────────────────────────────────────────────────
            // Description
            // ────────────────────────────────────────────────────────────────
            if (formation.description) {

                document.getElementById('formation_description').value =
                    formation.description;

                if (
                    typeof CKEDITOR !== 'undefined' &&
                    CKEDITOR.instances['formation_description']
                ) {

                    CKEDITOR.instances['formation_description']
                        .setData(formation.description);
                }
            }


            // ────────────────────────────────────────────────────────────────
            // Image
            // ────────────────────────────────────────────────────────────────
            if (formation.img_link) {

                document.getElementById('imagePreview').src =
                    formation.img_link;
            }

        })
        .catch(err => {

            console.error('Failed to load data:', err);

            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'Failed to load formation data.',
                confirmButtonColor: '#4c4b9e',
            });
        });


        // ────────────────────────────────────────────────────────────────
        // Image Preview
        // ────────────────────────────────────────────────────────────────
        document.getElementById('formation_logoFile')
            .addEventListener('change', function () {

                const file = this.files[0];

                if (file) {

                    const reader = new FileReader();

                    reader.onload = function (e) {

                        document.getElementById('imagePreview').src =
                            e.target.result;
                    };

                    reader.readAsDataURL(file);
                }
            });



        // ────────────────────────────────────────────────────────────────
        // Remove Image
        // ────────────────────────────────────────────────────────────────
        document.getElementById('remove-img')
            .addEventListener('click', function () {

                document.getElementById('imagePreview').src =
                    "{{ url_for('static', filename='assets/images/formation-empty.jpg') }}";

                document.getElementById('formation_logoFile').value = '';
            });

        // ────────────────────────────────────────────────────────────────
        // Submit / Edit button
        // ────────────────────────────────────────────────────────────────
        document.getElementById('create_formation').addEventListener('click', async function (e) {
            e.preventDefault();

            // ── Collect plain fields ──────────────────────────────────────
            const payload = {
                name:           document.getElementById('formation_name').value.trim(),
                status:         document.getElementById('formation_status').value,
                accountLevel:   document.getElementById('formation_accountLevel').value,
                accountSection: document.getElementById('formation_accountSection').value,
                typeDate:       document.getElementById('formation_typeDate').value,
                otherTypeDate:  document.getElementById('formation_otherTypeDate').value.trim(),
                numberDayDuration: document.getElementById('formation_numberDayDuration').value.trim(),
                numberSession:  document.getElementById('formation_numberSession').value.trim(),
                typeSession:    document.getElementById('formation_typeSession').value,
                otherTypeSession: document.getElementById('formation_otherTypeSession').value.trim(),
                conditionOfPassage: document.getElementById('formation_conditionOfPassage').value,
                conditionOfPassageFormule: document.getElementById('formation_conditionOfPassageFormule').value,
                conditionOfPassageFormuleByNote: document.getElementById('formation_conditionOfPassageFormuleByNote').value.trim(),
                conditionOfPassageFormuleByPresent: document.getElementById('formation_conditionOfPassageFormuleByPresent').value.trim(),
                conditionOfPassageFormuleByNotePresent: document.getElementById('formation_conditionOfPassageFormuleByNotePresent').value.trim(),
                publicResource: document.getElementById('formation_publicResource').value,

                // Hidden delete-tracking fields
                deleteSeasonJson:   document.getElementById('deleteSeasonJson').value,
                deleteSubjectsJson: document.getElementById('deleteSubjectsJson').value,
            };

            // ── Description (CKEditor or plain textarea) ──────────────────
            if (typeof CKEDITOR !== 'undefined' && CKEDITOR.instances['formation_description']) {
                payload.description = CKEDITOR.instances['formation_description'].getData();
            } else {
                payload.description = document.getElementById('formation_description').value;
            }



            // ── Basic validation ──────────────────────────────────────────
            if (!payload.name) {
                return Swal.fire({ icon: 'warning', title: 'Required', text: 'Name is required.', confirmButtonColor: '#4c4b9e' });
            }
            if (!payload.typeDate) {
                return Swal.fire({ icon: 'warning', title: 'Required', text: 'Date and Session Analytics is required.', confirmButtonColor: '#4c4b9e' });
            }
            if (!payload.typeSession) {
                return Swal.fire({ icon: 'warning', title: 'Required', text: 'Session Modes Analysis is required.', confirmButtonColor: '#4c4b9e' });
            }
            if (!payload.conditionOfPassage) {
                return Swal.fire({ icon: 'warning', title: 'Required', text: 'Passage Conditions is required.', confirmButtonColor: '#4c4b9e' });
            }

            // ── Send ──────────────────────────────────────────────────────
            try {
                const response = await fetch(`/api/update_formation/${FORMATION_ID}`, {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify(payload),
                });

                const result = await response.json();

                if (response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Updated',
                        text: 'Formation updated successfully.',
                        confirmButtonColor: '#4c4b9e',
                    }).then(() => {
                        window.location.href = '/dashboard/show-formation';
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: result.Message || 'Failed to update formation.',
                        confirmButtonColor: '#4c4b9e',
                    });
                }

            } catch (err) {
                console.error('Update error:', err);
                Swal.fire({
                    icon: 'error',
                    title: 'Network Error',
                    text: 'Could not reach the server.',
                    confirmButtonColor: '#4c4b9e',
                });
            }
        });



    });
</script>
