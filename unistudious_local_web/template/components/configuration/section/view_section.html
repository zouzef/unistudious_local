<div class="content-body">
    <div class="container-fluid">
        <div class="row">
            <div class="col-xl-12">
                <div class="card">
                    <div class="card-header">
                        <h4 class="card-title">{{ t('section_details') }}</h4>
                    </div>
                    <div class="card-body">
                        <form name="account_section" method="post" id="account-section-form">
                            <div class="row">
                                <div class="col-xl-12 col-lg-12">
                                    <div class="row">

                                        <div class="col-xl-6 col-sm-6">
                                            <div class="mb-3">
                                                <label class="form-label" for="account_section_sectionConfig">
                                                    {{ t('section') }} <code class="highlighter-rouge">*</code>
                                                </label>
                                                <br>
                                                <select id="account_section_sectionConfig"
                                                        name="account_section[sectionConfig]"
                                                        class="selectpicker"
                                                        aria-label="Section"
                                                        data-live-search="true"
                                                        required>
                                                    <option value="">{{ t('choose_the_section') }}</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div class="col-xl-6 col-sm-6">
                                            <div class="mb-3">
                                                <label class="form-label" for="account_section_status">
                                                    {{ t('status') }} <code class="highlighter-rouge">*</code>
                                                </label>
                                                <select id="account_section_status"
                                                        name="account_section[status]"
                                                        class="selectpicker form-control">
                                                    <option value="1" selected>{{ t('active') }}</option>
                                                    <option value="0">{{ t('inactive') }}</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div class="col-xl-6 col-sm-6" id="div-other-title" style="display: none;">
                                            <div class="mb-3">
                                                <label class="form-label" for="account_section_otherSection">
                                                    {{ t('other_section') }} <code class="highlighter-rouge">*</code>
                                                </label>
                                                <input type="text"
                                                       id="account_section_otherSection"
                                                       name="account_section[otherSection]"
                                                       class="form-control"
                                                       placeholder="{{ t('enter_new_section_name') }}">
                                            </div>
                                        </div>

                                        <div class="col-xl-12 col-sm-12">
                                            <div class="mb-3">
                                                <label class="form-label" for="account_section_description">
                                                    {{ t('description') }}
                                                </label>
                                                <textarea id="account_section_description"
                                                          name="account_section[description]"
                                                          class="form-control"
                                                          rows="7"
                                                          data-ckeditor="true"></textarea>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </div>

                            <div class="float-end">
                                <button type="submit" class="btn btn-outline-success me-2">{{ t('edit') }}</button>
                                <a class="btn btn-outline-danger" href="/dashboard/show-section">{{ t('close') }}</a>
                            </div>

                            <input type="hidden"
                                   id="account_section__token"
                                   name="account_section[_token]"
                                   value="">
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const ACCOUNT_ID         = {{ account_id }};
    const ACCOUNT_SECTION_ID = {{ account_section_id }};

    document.addEventListener('DOMContentLoaded', function () {

        const select     = document.getElementById('account_section_sectionConfig');
        const divOther   = document.getElementById('div-other-title');
        const inputOther = document.getElementById('account_section_otherSection');

        // ─── Load sections + prefill form ─────────────────────────────────
        Promise.all([
            fetch('/api/get_section_config').then(res => res.json()),
            fetch(`/api/view_account_section/${ACCOUNT_SECTION_ID}`).then(res => res.json())
        ])
        .then(([sections, accountSectionArr]) => {
            const accountSection = accountSectionArr[0];

            // Load all sections into select
            sections.forEach(section => {
                const option       = document.createElement('option');
                option.value       = section.id;
                option.textContent = section.name;
                if (section.name.toLowerCase() === 'other') {
                    option.dataset.isOther = 'true';
                }
                if (section.id === accountSection.section_config_id) {
                    option.selected = true;
                }
                select.appendChild(option);
            });

            $('#account_section_sectionConfig').selectpicker('refresh');

            // Show "Other" input if the selected section is "Other"
            const selectedOption = select.options[select.selectedIndex];
            if (selectedOption && selectedOption.dataset.isOther === 'true') {
                divOther.style.display = 'block';
                inputOther.required    = true;
                inputOther.value       = accountSection.other_section ?? '';
            }

            // Pre-fill status
            document.getElementById('account_section_status').value = accountSection.status;
            $('#account_section_status').selectpicker('refresh');

            // Pre-fill description
            if (accountSection.description) {
                document.getElementById('account_section_description').value = accountSection.description;
                if (typeof CKEDITOR !== 'undefined') {
                    CKEDITOR.instances['account_section_description']?.setData(accountSection.description);
                }
            }
        })
        .catch(err => {
            console.error('Failed to load data:', err);
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'Failed to load section data.',
                confirmButtonColor: '#4c4b9e',
            });
        });

        // ─── Show / hide "Other" input on change ──────────────────────────
        $('#account_section_sectionConfig').on('change', function () {
            const selectedOption = this.options[this.selectedIndex];
            const isOther        = selectedOption.dataset.isOther === 'true';

            if (isOther) {
                divOther.style.display = 'block';
                inputOther.required    = true;
            } else {
                divOther.style.display = 'none';
                inputOther.required    = false;
                inputOther.value       = '';
            }
        });

        // ─── Form submit (Edit) ────────────────────────────────────────────
        document.getElementById('account-section-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const section_id     = select.value;
            const selectedOption = select.options[select.selectedIndex];
            const isOther        = selectedOption.dataset.isOther === 'true';
            const otherSection   = inputOther.value.trim();
            const status         = document.getElementById('account_section_status').value;
            const description    = document.getElementById('account_section_description').value.trim() || null;

            // ── Validation ─────────────────────────────────────────────────
            if (!section_id) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Required!',
                    text: 'Please select a section.',
                    confirmButtonColor: '#4c4b9e',
                });
                return;
            }

            if (isOther && !otherSection) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Required!',
                    text: 'Please enter the name of the other section.',
                    confirmButtonColor: '#4c4b9e',
                });
                return;
            }

            // ── Send request ───────────────────────────────────────────────
            fetch(`/api/update_account_section/${ACCOUNT_SECTION_ID}`, {
                method  : 'POST',
                headers : { 'Content-Type': 'application/json' },
                body    : JSON.stringify({
                    sectionId   : section_id,
                    status      : status,
                    description : description,
                    other       : isOther ? otherSection : null
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.Message === 'account_section updated successfully') {
                    Swal.fire({
                        icon: 'success',
                        title: 'Success!',
                        text: 'Section updated successfully!',
                        confirmButtonColor: '#4c4b9e',
                    }).then(() => {
                        window.location.href = '/dashboard/show-section';
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops!',
                        text: data.Message,
                        confirmButtonColor: '#4c4b9e',
                    });
                }
            })
            .catch(err => {
                Swal.fire({
                    icon: 'error',
                    title: 'Server Error',
                    text: 'Something went wrong, please try again.',
                    confirmButtonColor: '#4c4b9e',
                });
            });
        });

    });
</script>
