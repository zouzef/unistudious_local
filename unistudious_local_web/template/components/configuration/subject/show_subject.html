<div class="content-body">
    <div class="container-fluid">
        <div class="row">
            <div class="col-xl-12">
                <div class="card">
                    <div class="card-header flex-wrap px-3">
                        <h4 class="card-title">{{ t('list_subjects_title') }}</h4>
                        <a href="/dashboard/create-subject" class="btn btn-primary">{{ t('new_subject') }}</a>
                    </div>

                    <div class="card-body p-0">

                        <!-- Loading state -->
                        <div id="table-loading" class="text-center py-4">
                            <div class="spinner-border text-primary" role="status"></div>
                            <p class="mt-2 text-muted">{{ t('loading_subjects') }}</p>
                        </div>

                        <!-- Error state -->
                        <div id="table-error" class="text-center py-4 d-none">
                            <p class="text-danger" id="error-message"></p>
                        </div>

                        <!-- Table wrapper -->
                        <div id="table-wrapper" class="table-responsive d-none">
                            <table id="example" class="display table dataTable no-footer" style="min-width: 845px;">
                                <thead>
                                    <tr>
                                        <th>{{ t('id') }}</th>
                                        <th>{{ t('subject') }}</th>
                                        <th>{{ t('status') }}</th>
                                        <th>{{ t('actions') }}</th>
                                    </tr>
                                </thead>
                                <tbody id="subjects-tbody">
                                    <!-- Rows injected by JS -->
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const ACCOUNT_ID = {{ account_id }};

    window.addEventListener('load', function () {

        let dataTableInstance = null;

        function initDataTable() {
            if ($.fn.DataTable.isDataTable('#example')) {
                $('#example').DataTable().destroy();
                dataTableInstance = null;
            }

            dataTableInstance = $('#example').DataTable({
                order: [[0, 'desc']],
                pageLength: 10,
                lengthChange: true,
                lengthMenu: [10, 25, 50, 100],
                language: {
                    lengthMenu: 'Show _MENU_ entries',
                    paginate: {
                        next: '<i class="fa-solid fa-angle-right"></i>',
                        previous: '<i class="fa-solid fa-angle-left"></i>'
                    }
                },
                drawCallback: function () {
                    stylePaginationButtons();
                }
            });
        }

        function loadSubjects() {
            fetch(`/api/get_account_subject/${ACCOUNT_ID}`)
                .then(res => {
                    if (!res.ok) throw new Error(`Server returned ${res.status}`);
                    return res.json();
                })
                .then(subjects => {
                    const loading = document.getElementById('table-loading');
                    const error   = document.getElementById('table-error');
                    const wrapper = document.getElementById('table-wrapper');
                    const tbody   = document.getElementById('subjects-tbody');

                    if ($.fn.DataTable.isDataTable('#example')) {
                        $('#example').DataTable().destroy();
                        dataTableInstance = null;
                    }

                    if (!subjects || subjects.length === 0) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="4" class="text-center">No subjects found</td>
                            </tr>`;
                        loading.classList.add('d-none');
                        wrapper.classList.remove('d-none');
                        initDataTable();
                        return;
                    }

                    tbody.innerHTML = subjects.map(subject => {
                        const isActive   = subject.status === 1;
                        const badgeClass = isActive ? 'badge-success' : 'badge-danger';
                        const dotClass   = isActive ? 'text-success'  : 'text-danger';
                        const badgeLabel = isActive ? 'Active'        : 'Inactive';

                        return `
                            <tr>
                                <td><span class="text-primary font-w600">${subject.id}</span></td>
                                <td>${subject.section_name ?? subject.name ?? '—'}</td>
                                <td>
                                    <span class="badge light ${badgeClass}">
                                        <i class="fa fa-circle ${dotClass} me-1"></i>
                                        ${badgeLabel}
                                    </span>
                                </td>
                                <td>
                                    <div class="d-flex">
                                        <a href="#" data-id="${subject.id}" class="delete-subject btn btn-rounded btn-outline-danger btn-sm me-2">
                                            <i class="fa fa-trash me-1"></i> {{ t('delete') }}
                                        </a>
                                        <a href="/dashboard/view_subject/${subject.id}" class="btn btn-rounded btn-outline-success btn-sm">
                                            <i class="fa fa-eye me-1"></i> {{ t('view') }}
                                        </a>
                                    </div>
                                </td>
                            </tr>`;
                    }).join('');

                    loading.classList.add('d-none');
                    wrapper.classList.remove('d-none');
                    initDataTable();
                })
                .catch(err => {
                    const loading = document.getElementById('table-loading');
                    const error   = document.getElementById('table-error');
                    loading.classList.add('d-none');
                    error.classList.remove('d-none');
                    document.getElementById('error-message').textContent = err.message;
                });
        }

        function stylePaginationButtons() {
            const paginate = document.querySelector('.dataTables_paginate');
            if (!paginate) return;

            paginate.querySelectorAll('span > a, a.paginate_button').forEach(btn => {
                btn.style.cssText = `
                    min-width: 32px; height: 32px; border-radius: 8px;
                    border: 1.5px solid #e0dfef; background: #fff;
                    color: #4c4b8f; font-size: 13px; font-weight: 500;
                    cursor: pointer; display: inline-flex; align-items: center;
                    justify-content: center; padding: 0 6px; margin: 0 2px;
                    text-decoration: none; transition: background .15s;
                `;
            });

            paginate.querySelectorAll('a.paginate_button.current').forEach(btn => {
                btn.style.cssText += `background: #4c4b9e !important; color: #fff !important; border-color: #4c4b9e !important;`;
            });

            paginate.querySelectorAll('a.paginate_button.disabled').forEach(btn => {
                btn.style.opacity = '0.35';
                btn.style.cursor  = 'default';
            });
        }

        // ─── Delete handler with SweetAlert2 ──────────────────────────────
        document.addEventListener('click', function (e) {
            const btn = e.target.closest('.delete-subject');
            if (!btn) return;
            e.preventDefault();

            const subject_id = btn.dataset.id;

            Swal.fire({
                title: 'Are you sure?',
                text: 'This subject will be permanently deleted!',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#4c4b9e',
                confirmButtonText: 'Yes, delete it!',
                cancelButtonText: 'Cancel'
            }).then((result) => {
                if (result.isConfirmed) {
                    fetch(`/api/delete_account_subject/${subject_id}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    })
                    .then(res => res.json())
                    .then(data => {
                        Swal.fire({
                            icon: 'success',
                            title: 'Deleted!',
                            text: 'Subject has been deleted successfully.',
                            confirmButtonColor: '#4c4b9e',
                        }).then(() => {
                            loadSubjects();
                        });
                    })
                    .catch(err => {
                        Swal.fire({
                            icon: 'error',
                            title: 'Server Error',
                            text: 'Something went wrong, please try again.',
                            confirmButtonColor: '#4c4b9e',
                        });
                    });
                }
            });
        });

        loadSubjects();
    });
</script>
