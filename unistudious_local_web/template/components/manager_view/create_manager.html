<div class="content-body">
    <div class="container-fluid">
        <div class="row">
            <div class="col-xl-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Create New Manager</h5>
                    </div>
                    <div class="card-body">
                        <form name="manager" method="post" id="manager-form" enctype="multipart/form-data">
                            <div class="row">
                                <div class="col-xl-6 col-sm-6">
                                    <div class="mb-3">
                                        <label for="username" class="form-label text-primary">Username <span
                                                class="required">*</span></label>
                                        <input type="text" id="manager_username" name="manager[username]"
                                               required="required" class="form-control"><br>
                                    </div>
                                    <div class="mb-3">
                                        <label for="email" class="form-label text-primary">Email <span class="required">*</span></label>
                                        <input type="email" id="manager_email" name="manager[email]" required="required"
                                               class="form-control"><br>
                                    </div>
                                    <div class="mb-3">
                                        <label for="exampleFormControlTextarea1"
                                               class="form-label text-primary">Address</label>
                                        <textarea id="manager_Address" name="manager[Address]" class="form-control"
                                                  rows="7"></textarea><br>
                                    </div>
                                </div>
                                <div class="col-xl-6 col-sm-6">
                                    <div class="mb-3">
                                        <label for="fullName" class="form-label text-primary">First Name And Last Name
                                            <span class="required">*</span></label>
                                        <input type="text" id="manager_fullName" name="manager[fullName]"
                                               required="required" class="form-control"><br>
                                    </div>
                                    <div class="mb-3">
                                        <label for="Phone" class="form-label text-primary">Phone</label>
                                        <input type="tel" id="manager_phone" name="manager[phone]" class="form-control"
                                               minlength="8" maxlength="16"><br>
                                    </div>
                                    <div class="mb-3">
                                        <label for="roles" class="form-label text-primary">Roles <span class="required">*</span></label>
                                        <select id="roless" name="manager[roles]" class="form-control no-selectpicker">
                                            <option value="ROLE_MANAGER_CONFIG">Support / Configuration</option>
                                            <option value="ROLE_MANAGER_FINANCE">Financial</option>
                                            <option value="ROLE_MANAGER_HR">Human Resources</option>
                                            <option value="ROLE_MANAGER_IT">IT Support and Infrastructure</option>
                                            <option value="ROLE_MANAGER_MARKETING">Marketing</option>
                                            <option value="ROLE_CUSTOMER_MANAGER_SERVICE">Customer Service</option>
                                            <option value="ROLE_MANAGER_ADMINISTRATIVE">Administrative</option>
                                        </select>
                                    </div>
                                    <br>
                                    <div class="mb-3">
                                        <label class="form-label text-primary">Photo</label>
                                        <div class="avatar-upload">
                                            <div class="avatar-preview">
                                                <div id="imagePreview"
                                                     style="background-image: url(/static/assets/images/no-img-avatar.png);"></div>
                                            </div>
                                        </div>
                                        <div class="change-btn mt-1">
                                            <input type="file" id="manager_imgFile" name="manager[imgFile]"
                                                   class="d-none" accept=".png, .jpg, .jpeg">
                                            <br>
                                            <label for="manager_imgFile"
                                                   class="dlab-upload mb-0 btn btn-primary btn-sm">Choose File</label>
                                            <a href="javascript:void(0);"
                                               class="btn btn-danger light remove-img ms-2 btn-sm" id="remove-img">Remove</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row mb-5">
                                <div class="col-xl-6 mb-3">
                                    <label class="form__label">Password <span class="required">*</span></label>
                                    <input type="password" id="manager_password_first" name="manager[password][first]"
                                           required="required" class="form-control" minlength="4" maxlength="25">
                                </div>
                                <div class="col-xl-6 mb-3">
                                    <label class="form__label">Re-Enter Password <span class="required">*</span></label>
                                    <input type="password" id="manager_password_second" name="manager[password][second]"
                                           required="required" class="form-control" minlength="4" maxlength="25">
                                </div>
                            </div>
                            <div class="float-end">
                                <button class="btn btn-outline-primary me-3" type="submit">Create</button>
                                <a href="/dashboard/show-manager" class="btn btn-outline-danger">Close</a>
                            </div>
                            <input type="hidden" id="manager__token" name="manager[_token]"
                                   value="a22a53366cf.agDHavCEDrAOZwvF1rz8JMmaQ9Hhan3KiiYXFmoOuoo.AWyBK8O1X8Y6UGma5NO-U5vzGr65HBCZvEhETFlKzfs5a7ZZ3f496DpXRg">
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    const accountId = {{ account_id }};

    document.addEventListener("DOMContentLoaded", function () {

        // ─── Image Preview ────────────────────────────────────────────────
        document.getElementById("manager_imgFile").addEventListener("change", function () {
            const file = this.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                document.getElementById("imagePreview").style.backgroundImage = `url(${e.target.result})`;
            };
            reader.readAsDataURL(file);
        });

        // ─── Remove Image ─────────────────────────────────────────────────
        document.getElementById("remove-img").addEventListener("click", function () {
            document.getElementById("manager_imgFile").value = "";
            document.getElementById("imagePreview").style.backgroundImage =
                `url(/static/assets/images/no-img-avatar.png)`;
        });

        // ─── Form Submit ──────────────────────────────────────────────────
        document.getElementById("manager-form").addEventListener("submit", function (e) {
            e.preventDefault();

            const submitBtn = document.querySelector('#manager-form button[type="submit"]');

            const password = document.getElementById("manager_password_first").value;
            const confirmPassword = document.getElementById("manager_password_second").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match");
                return;
            }

            const selectedRole = document.getElementById("roless").value;
            if (!selectedRole) {
                alert("Please select a role");
                return;
            }

            const formData = new FormData();
            formData.append("fullName", document.getElementById("manager_fullName").value);
            formData.append("username", document.getElementById("manager_username").value);
            formData.append("email", document.getElementById("manager_email").value);
            formData.append("phone_number", document.getElementById("manager_phone").value);
            formData.append("location", document.getElementById("manager_Address").value);
            formData.append("password", password);

            // roles sent as repeated roles[] keys — matches backend's request.form.getlist("roles[]")
            formData.append("roles[]", selectedRole);

            const imageFile = document.getElementById("manager_imgFile").files[0];
            if (imageFile) {
                formData.append("image", imageFile);
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Creating...";

            fetch(`/api/create_manager/${accountId}`, {
                method: "POST",
                body: formData
                // No Content-Type header — browser sets multipart boundary automatically
            })
            .then(res => res.json())
            .then(result => {
                console.log("Response:", result);
                if (result.Message === "success") {
                    window.location.href = "/dashboard/show-manager";
                } else {
                    alert("Error creating manager: " + JSON.stringify(result.Response || result.Message));
                }
            })
            .catch(err => {
                console.error("❌ Request failed:", err);
                alert("Network error while creating manager");
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = "Create";
            });
        });
    });
</script>
