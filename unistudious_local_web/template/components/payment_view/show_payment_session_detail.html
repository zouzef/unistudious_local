<div class="content-body">
    <div class="container-fluid">
        <div class="top-bar mb-4">
            <div class="row justify-content-between align-items-center">
                <div class="col-md-4">
                    <a href="/dashboard/show-payment-session" class="btn btn-secondary btn-custom">
                        <i class="fas fa-arrow-left"></i> Return
                    </a>
                </div>
                <div class="col-md-4 text-end">
                    <button id="download-all-order-user-pdf" class="btn btn-primary">
                        <i class="fas fa-download"></i> Download Payment PDF
                    </button>
                </div>
            </div>
        </div>

        <div class="col-xl-12">
            <div class="card">
                <div class="card-header border-0 p-3">
                    <h4 class="card-title">Payment Session Details</h4>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <strong>Session ID : </strong> <span data-field="uuid"></span>
                    </div>
                    <div class="mb-3">
                        <strong>Title : </strong> <span data-field="name"></span>
                    </div>
                    <div class="mb-3">
                        <strong>Price : </strong> <span data-field="price"></span>
                    </div>
                    <div class="table-responsive basic-tbl">
                        <table id="session-payment-data-table" class="display dataTable no-footer" style="min-width: 845px;">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Student</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                    <th>Last Payment Date</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="payment-table-body">
                                <!-- Populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const sessionId = {{ session_id }};

const formatDate = (dateStr) => {
    if (!dateStr) return 'N/A';
    return new Date(dateStr).toLocaleDateString('en-GB');
};

const getStatusBadge = (status) => {
    const badges = {
        'Paid':      'badge-success',
        'Unpaid':    'badge-danger',
        'Cancelled': 'badge-danger',
        'Pending':   'badge-warning',
    };
    const cls = badges[status] || 'badge-secondary';
    return `<span class="badge ${cls} light badge-sm">${status}</span>`;
};

function loadSessionInfo() {
    fetch(`/api/get-session-info/${sessionId}`)
        .then(res => res.json())
        .then(data => {
            const session = data[0];

            document.querySelector('[data-field="uuid"]').textContent = session.uuid;
            document.querySelector('[data-field="name"]').textContent = session.name;
            document.querySelector('[data-field="price"]').textContent =
                `${session.price} ${session.currency} / ${session.type_pay}`;

            const downloadBtn = document.getElementById('download-all-order-user-pdf');
            downloadBtn.dataset.sessionId   = session.id;
            downloadBtn.dataset.sessionName = session.name;
            downloadBtn.dataset.typePay     = session.type_pay;
            downloadBtn.dataset.startDate   = formatDate(session.start_date);
            downloadBtn.dataset.endDate     = formatDate(session.end_date);
        })
        .catch(err => console.error('Error loading session info:', err));
}

function loadPaymentData() {
    fetch(`/api/get_payment_session/${sessionId}`)
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById('payment-table-body');
            const payments = data.Data;

            if (!payments || payments.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center">No payment records found</td>
                    </tr>`;
                return;
            }

            tbody.innerHTML = payments.map(item => `
                <tr>
                    <td>${item.user_id}</td>
                    <td>${item.user_id}</td>
                    <td>${item.amount ? item.amount : item.price} TND</td>
                    <td>${getStatusBadge(item.status)}</td>
                    <td>${formatDate(item.date_payment)}</td>
                    <td>
                        <button class="btn btn-warning btn-sm open-change-amount-modal"
                            data-user-id="${item.user_id}"
                            data-session-id="${item.session_id}"
                            data-amount="${item.price}">
                            Change Amount
                        </button>
                        <a href="/dashboard/show-payment-user-session/${item.uuid}/${sessionId}"
                            class="btn btn-primary btn-sm">
                            Go to Payment
                        </a>
                    </td>
                </tr>
            `).join('');
        })
        .catch(err => console.error('Error loading payment data:', err));
}

loadSessionInfo();
loadPaymentData();
</script>
