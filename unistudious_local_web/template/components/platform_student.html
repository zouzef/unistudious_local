<script>
    /* ===============================================
   USER MANAGEMENT - TABLE PAGE
   =============================================== */

// ==================== CONFIGURATION ====================
const CONFIG = {
  USERS_PER_PAGE: 10
};

// ==================== STATE ====================
const state = {
  accountId: window.ACCOUNT_ID,
  allUsers: [],
  currentPage: 1
};

// ==================== API ====================
const API = {
  async fetchUsers(accountId) {
    const response = await fetch(`/api/get-all-users/${accountId}`);
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    const result = await response.json();
    return result.data?.data ?? result.data ?? [];
  }
};

// ==================== TABLE ====================
async function loadTableUsers(accountId) {
  const tbody = document.querySelector('#example8 tbody');

  if (!tbody) {
    console.error("❌ #example8 tbody not found in DOM");
    return;
  }

  try {
    // Show spinner
    tbody.innerHTML = `
      <tr>
        <td colspan="5" class="text-center py-4">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </td>
      </tr>`;

    const users = await API.fetchUsers(accountId);

    state.allUsers = users;
    state.currentPage = 1;

    renderTable(state.allUsers, state.currentPage);

  } catch (error) {
    console.error("❌ Error loading table users:", error);
    tbody.innerHTML = `
      <tr>
        <td colspan="5">
          <div class="alert alert-danger m-3">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            Failed to load users. Please try again.
          </div>
        </td>
      </tr>`;
  }
}

function renderTable(users, page) {
  const tbody = document.querySelector('#example8 tbody');

  if (!users.length) {
    tbody.innerHTML = `
      <tr>
        <td colspan="5" class="text-center py-4 text-muted">No users found.</td>
      </tr>`;
    renderPagination(0, page);
    return;
  }

  // Slice for current page
  const start = (page - 1) * CONFIG.USERS_PER_PAGE;
  const end = start + CONFIG.USERS_PER_PAGE;
  const pageUsers = users.slice(start, end);
      tbody.innerHTML = pageUsers.map(user => `
      <tr id="student-row-${user.id}" class="selected">
        <td class="student-name">
          <div class="trans-list">
            <h4>${user.full_name ?? '-'}</h4>
          </div>
        </td>
        <td class="student-phone">
          <div class="trans-list">
            <h4>${user.phone ?? '-'}</h4>
          </div>
        </td>
        <td class="student-email">
          <div class="trans-list">
            <h4>${user.email ?? '-'}</h4>
          </div>
        </td>
        <td class="student-type">
          ${user.isvirtual
              ? `<span class="badge light badge-warning">
                   <i class="fa fa-circle text-warning me-1"></i>
                   Virtual
                 </span>`
              : `<span class="badge light badge-primary">
                   <i class="fa fa-circle text-primary me-1"></i>
                   Real
                 </span>`
          }
        </td>
        <td>
          ${user.isvirtual
              ? `<a data-user-id="${user.id}"
                    data-id="${user.id}"
                    data-account-id="${state.accountId}"
                    class="btn btn-sm btn-success btn-associate-virtual-user">
                     Associate Student
                   </a>
                   <a data-user-id="${user.id}"
                      class="btn btn-sm btn-info btn-manage-sessions-virtual-user">
                     Manage Sessions
                   </a>
                   <a data-user-id="${user.id}"
                      data-id="${user.id}"
                      data-name="${user.full_name ?? ''}"
                      data-account-id="${state.accountId}"
                      class="btn btn-sm btn-primary btn-edit-virtual-user">
                     Edit
                   </a>
                   <a data-user-id="${user.id}"
                      data-id="${user.id}"
                      data-account-id="${state.accountId}"
                      class="btn btn-sm btn-danger btn-delete-virtual-user">
                     Delete
                   </a>`
              : `<a data-user-id="${user.id}"
                    data-id="${user.id}"
                    data-name="${user.full_name ?? ''}"
                    data-account-id="${state.accountId}"
                    class="btn btn-sm btn-primary btn-edit-virtual-user">
                     Edit
                   </a>
                   <a data-user-id="${user.id}"
                      class="btn btn-sm btn-info btn-manage-sessions-virtual-user">
                     Manage Sessions
                   </a>
                   <a href="/dashboard/show-profile/${user.id}"
                      class="btn btn-sm btn-warning">
                     Show Profile
                   </a>`
          }
        </td>
      </tr>
    `).join('');

  renderPagination(users.length, page);
}

// ==================== PAGINATION ====================
function renderPagination(totalUsers, page) {
  const controls = document.getElementById("pagination-controls");
  const totalPages = Math.ceil(totalUsers / CONFIG.USERS_PER_PAGE);

  if (totalPages <= 1) {
    controls.innerHTML = '';
    return;
  }

  // Build page numbers with dots
  let pages = new Set([1, totalPages, page]);
  if (page - 1 > 0) pages.add(page - 1);
  if (page + 1 <= totalPages) pages.add(page + 1);
  pages = [...pages].sort((a, b) => a - b);

  let paginationHTML = `
    <li class="page-item ${page === 1 ? 'disabled' : ''}">
      <a class="page-link" id="prev-page" href="javascript:void(0);">
        <i class="fa-solid fa-chevron-left"></i>
      </a>
    </li>`;

  let prev = null;
  pages.forEach(p => {
    if (prev && p - prev > 1) {
      paginationHTML += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
    }
    paginationHTML += `
      <li class="page-item ${p === page ? 'active' : ''}">
        <a class="page-link" href="javascript:void(0);" data-page="${p}">${p}</a>
      </li>`;
    prev = p;
  });

  paginationHTML += `
    <li class="page-item ${page === totalPages ? 'disabled' : ''}">
      <a class="page-link" id="next-page" href="javascript:void(0);">
        <i class="fa-solid fa-chevron-right"></i>
      </a>
    </li>`;

  controls.innerHTML = paginationHTML;
  attachPaginationEvents(totalPages);
}

function attachPaginationEvents(totalPages) {
  const controls = document.getElementById("pagination-controls");

  // Page number clicks
  controls.querySelectorAll('[data-page]').forEach(btn => {
    btn.addEventListener('click', function () {
      state.currentPage = parseInt(this.dataset.page);
      renderTable(state.allUsers, state.currentPage);
    });
  });

  // Previous button
  const prevBtn = document.getElementById("prev-page");
  if (prevBtn) {
    prevBtn.addEventListener('click', function () {
      if (state.currentPage > 1) {
        state.currentPage--;
        renderTable(state.allUsers, state.currentPage);
      }
    });
  }

  // Next button
  const nextBtn = document.getElementById("next-page");
  if (nextBtn) {
    nextBtn.addEventListener('click', function () {
      if (state.currentPage < totalPages) {
        state.currentPage++;
        renderTable(state.allUsers, state.currentPage);
      }
    });
  }
}

// ==================== EDIT MODAL ====================
document.addEventListener('click', function (e) {
    const btn = e.target.closest('.btn-edit-virtual-user');
    if (!btn) return;

    const userId   = btn.dataset.userId;
    const userName = btn.dataset.name;

    // Find user from state
    const user = state.allUsers.find(u => u.id == userId);
    if (!user) return;

    // Populate modal fields
    document.getElementById('editUserId').value    = user.id;
    document.getElementById('editId').value        = user.id;
    document.getElementById('editAccountId').value = state.accountId;
    document.getElementById('editName').value      = user.full_name  ?? '';
    document.getElementById('editEmail').value     = user.email      ?? '';
    document.getElementById('editPhone').value     = user.phone      ?? '';
    document.getElementById('editStatus').value    = user.status     ?? 1;

    // Open modal
    const modal = new bootstrap.Modal(document.getElementById('editStudentModal'));
    modal.show();
});

// ==================== DELETE VIRTUAL USER ====================
document.addEventListener('click', function (e) {
    const btn = e.target.closest('.btn-delete-virtual-user');
    if (!btn) return;

    const userId = btn.dataset.id;
    const userName = btn.closest('tr').querySelector('.student-name h4').textContent.trim();
    alert(userId);
    if (!confirm(`Are you sure you want to delete "${userName}" ?`)) return;

    fetch(`/api/delete-user/${userId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
    })
    .then(res => res.json())
    .then(data => {
        // Remove row from state
        state.allUsers = state.allUsers.filter(u => u.id != userId);

        // Re-render table
        renderTable(state.allUsers, state.currentPage);

        alert('✅ User deleted successfully');
    })
    .catch(err => {
        console.error('❌ Error deleting user:', err);
        alert('❌ Failed to delete user. Please try again.');
    });
});

// ==================== SAVE EDIT VIRTUAL USER ====================
document.getElementById('editStudentForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const id     = document.getElementById('editId').value;
    const payload = {
        name:   document.getElementById('editName').value.trim()  || null,
        email:  document.getElementById('editEmail').value.trim() || null,
        phone:  document.getElementById('editPhone').value.trim() || null,
        status: parseInt(document.getElementById('editStatus').value)
    };

    // Disable save button to prevent double submit
    const saveBtn = this.querySelector('button[type="submit"]');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    fetch(`/api/update-user/${id}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
        // Update user in state
        const index = state.allUsers.findIndex(u => u.id == id);
        if (index !== -1) {
            state.allUsers[index].full_name = document.getElementById('editName').value.trim();
            state.allUsers[index].email     = document.getElementById('editEmail').value.trim();
            state.allUsers[index].phone     = document.getElementById('editPhone').value.trim();
            state.allUsers[index].status    = parseInt(document.getElementById('editStatus').value);
        }

        // Close modal
        bootstrap.Modal.getInstance(document.getElementById('editStudentModal')).hide();

        // Re-render table
        renderTable(state.allUsers, state.currentPage);

        alert('✅ User updated successfully');
    })
    .catch(err => {
        console.error('❌ Error updating user:', err);
        alert('❌ Failed to update user. Please try again.');
    })
    .finally(() => {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save';
    });
});
// ==================== SESSIONS ====================
let cachedSessions = [];

async function fetchSessions() {
    if (cachedSessions.length > 0) return cachedSessions;
    try {
        const response = await fetch(`/api/get-sessions/${state.accountId}`);
        const result   = await response.json();

        // Handle all possible response shapes
        if (Array.isArray(result)) {
            cachedSessions = result;
        } else if (Array.isArray(result.data)) {
            cachedSessions = result.data;
        } else if (Array.isArray(result.data?.data)) {
            cachedSessions = result.data.data;
        } else {
            cachedSessions = [];
        }



        return cachedSessions;
    } catch (err) {
        console.error('❌ Error fetching sessions:', err);
        return [];
    }
}

function buildSessionOptions(sessions) {
    return sessions.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
}

function buildSessionCard(index, sessions) {
    return `
        <div class="relation-block border rounded p-3 mb-3" data-index="${index}">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="mb-0">Relation #${index}</h6>
                <button type="button" class="btn btn-sm btn-danger removeRelationBtn">Remove</button>
            </div>
            <div class="mb-3">
                <label class="form-label">Select Session</label>
                <select name="sessions[]" class="form-control sessionSelect" required data-live-search="true">
                    ${buildSessionOptions(sessions)}
                </select>
            </div>
        </div>`;
}

// ==================== MANAGE SESSIONS MODAL ====================
document.addEventListener('click', async function (e) {

    // Open modal
    const openBtn = e.target.closest('.btn-manage-sessions-virtual-user');
    if (openBtn) {
        const userId = openBtn.dataset.userId;
        document.getElementById('sessionUserId').value = userId;

        // Load sessions and populate existing card
        const sessions = await fetchSessions();
        const container = document.getElementById('relationsContainer');

        // Reset container with one fresh card
        container.innerHTML = buildSessionCard(1, sessions);

        const modal = new bootstrap.Modal(document.getElementById('manageSessionsModal'));
        modal.show();
    }

    // Remove relation card
    const removeBtn = e.target.closest('.removeRelationBtn');
    if (removeBtn) {
        removeBtn.closest('.relation-block').remove();
    }

    // Add new relation card
    const addBtn = e.target.closest('#addRelationBtn');
    if (addBtn) {
        const container = document.getElementById('relationsContainer');
        const index     = container.querySelectorAll('.relation-block').length + 1;
        const sessions  = await fetchSessions();
        container.insertAdjacentHTML('beforeend', buildSessionCard(index, sessions));
    }

});

// ==================== SAVE MANAGE SESSIONS ====================
document.getElementById('manageSessionsForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const userId   = document.getElementById('sessionUserId').value;
    const selects  = document.querySelectorAll('#relationsContainer .sessionSelect');
    const sessionIds = Array.from(selects).map(s => s.value);

    alert('User ID: ' + userId + '\nSession IDs: ' + sessionIds.join(', '));
});

// ==================== ADD STUDENT ====================
document.getElementById('createVirtualStudentForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const payload = {
        name:   document.getElementById('studentFullName').value.trim(),
        email:  document.getElementById('studentEmail').value.trim(),
        phone:  document.getElementById('studentPhone').value.trim(),
        status: document.getElementById('studentStatus').value
    };

    alert('📋 New Student Data:\n' + JSON.stringify(payload, null, 2));
});


// ==================== INIT ====================
function initPage() {
  loadTableUsers(state.accountId);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initPage);
} else {
  initPage();
}
</script>
