<div class="content-body">
    <div class="container-fluid">
        <div class="row">
            <div class="col-xl-12">
                <div class="row">
                    <div class="col-xl-12">
                        <div class="page-title flex-wrap">
                            <form id="searchForm" method="get" action="/dashboard/list-slc-camera">
                                <div class="input-group search-area mb-3">
                                    <input type="text" id="searchInput" class="form-control"
                                           placeholder="Search here..." name="search_admin" value="">
                                    <span class="input-group-text">
                                        <a href="javascript:void(0)">
                                            <svg width="15" height="15" viewBox="0 0 18 18" fill="none"
                                                 xmlns="http://www.w3.org/2000/svg">
                                                <path d="M17.5605 15.4395L13.7527 11.6317C14.5395 10.446 15 9.02625 15 7.5C15 3.3645 11.6355 0 7.5 0C3.3645 0 0 3.3645 0 7.5C0 11.6355 3.3645 15 7.5 15C9.02625 15 10.446 14.5395 11.6317 13.7527L15.4395 17.5605C16.0245 18.1462 16.9755 18.1462 17.5605 17.5605C18.1462 16.9747 18.1462 16.0252 17.5605 15.4395V15.4395ZM2.25 7.5C2.25 4.605 4.605 2.25 7.5 2.25C10.395 2.25 12.75 4.605 12.75 7.5C12.75 10.395 10.395 12.75 7.5 12.75C4.605 12.75 2.25 10.395 2.25 7.5V7.5Z"
                                                      fill="#01A3FF"></path>
                                            </svg>
                                        </a>
                                    </span>
                                </div>
                            </form>
                            <div>
                                <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                                        data-bs-target="#adminNewSlcCameraModal">
                                    + New Camera
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-12">
                        <div class="row" id="cameras-container">
                            <!-- Camera cards injected by JS -->
                        </div>
                        <div class="table-pagenation teach">
                            <small></small>
                            <nav>
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="pagination"></div>
                                    </div>
                                </div>
                            </nav>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Create Camera Modal -->
<div class="modal fade" id="adminNewSlcCameraModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="slcCameraForm">
                <input type="hidden" id="account-id" value="3">
                <div class="modal-header">
                    <h1 class="modal-title fs-5">Camera Details</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-xl-12">
                            <div class="mb-3">
                                <label class="form-label" for="cameraType">Camera Type</label>
                                <select class="form-control" id="cameraType" name="cameraType" required>
                                    <option value="">Select Type</option>
                                    <option value="ipcam">IP Camera</option>
                                    <option value="webcam">Webcam</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-xl-6">
                            <div class="mb-3">
                                <label class="form-label">MAC ID</label>
                                <input type="text" class="form-control" id="cameraMacId" name="macId" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Camera Name</label>
                                <input type="text" class="form-control" id="cameraName" name="name" required>
                            </div>
                            <div class="ip-camera-fields" style="display:none;">
                                <div class="mb-3">
                                    <label class="form-label">Username</label>
                                    <input type="text" class="form-control" id="cameraUsername" name="username">
                                </div>
                            </div>
                        </div>
                        <div class="col-xl-6">
                            <div class="mb-3">
                                <label class="form-label">Local</label>
                                <select class="form-control" id="cameraSlcLocal" name="slcLocal" required>
                                    <option value="">Select Local</option>
                                    <!-- locals injected by JS -->
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Room</label>
                                <select class="form-control" id="cameraRoomId" name="roomId" required>
                                    <option value="">Select Room</option>
                                </select>
                            </div>
                            <div class="ip-camera-fields" style="display:none;">
                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="text" class="form-control" id="cameraPassword" name="password">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger light" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Save Camera</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Status Camera Modal -->
<div class="modal fade" id="statusSlcCameraModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Status Camera</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="statusCameraId" name="id">
                <div class="mb-3">
                    <label for="showCameraStatus" class="form-label">Status</label>
                    <textarea id="showCameraStatus" rows="7" class="form-control" readonly></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Details Camera Modal -->
<div class="modal fade" id="showSlcCameraModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Camera Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="showCameraDetailId" name="id">
                <div class="mb-3">
                    <label for="showCameraType" class="form-label">Type</label>
                    <input type="text" class="form-control" id="showCameraType" readonly>
                </div>
                <div class="mb-3">
                    <label for="showCameraName" class="form-label">Name</label>
                    <input type="text" class="form-control" id="showCameraName" readonly>
                </div>
                <div class="mb-3">
                    <label for="showCameraMac" class="form-label">MAC ID</label>
                    <input type="text" class="form-control" id="showCameraMac" readonly>
                </div>
                <div id="showIpCameraFields" style="display:none;">
                    <div class="mb-3">
                        <label for="showCameraUsername" class="form-label">Username</label>
                        <input type="text" class="form-control" id="showCameraUsername" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="showCameraPassword" class="form-label">Password</label>
                        <input type="text" class="form-control" id="showCameraPassword" readonly>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="showCameraRoom" class="form-label">Room</label>
                    <input type="text" class="form-control" id="showCameraRoom" readonly>
                </div>
                <div class="mb-3">
                    <label for="showCameraCreatedAt" class="form-label">Created At</label>
                    <input type="text" class="form-control" id="showCameraCreatedAt" readonly>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ─── Load Locals ─────────────────────────────────────────────────────────

    function loadCameraLocals() {
        const accountId = document.getElementById('account-id').value;

        fetch(`/api/get_slc_info/${accountId}`)
            .then(res => res.json())
            .then(json => {
                const select = document.getElementById('cameraSlcLocal');
                select.innerHTML = '<option value="">Select Local</option>';

                json.data.forEach(local => {
                    const option = document.createElement('option');
                    option.value = local.id;
                    option.textContent = local.name;
                    select.appendChild(option);
                });
            })
            .catch(err => console.error('Error fetching locals:', err));
    }

    // ─── Load Rooms ──────────────────────────────────────────────────────────

    function loadCameraRooms() {
        fetch('/api/get_room')
            .then(res => res.json())
            .then(json => {
                const select = document.getElementById('cameraRoomId');
                select.innerHTML = '<option value="">Select Room</option>';

                json.data.forEach(room => {
                    const option = document.createElement('option');
                    option.value = room.id;
                    option.textContent = room.name;
                    select.appendChild(option);
                });
            })
            .catch(err => console.error('Error fetching rooms:', err));
    }

    // ─── Load Camera List ─────────────────────────────────────────────────────

    function loadCameraList() {
        fetch('/api/get_list_camera')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('cameras-container');

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="col-xl-12 text-center">
                            <p>No cameras found</p>
                        </div>`;
                    return;
                }

                container.innerHTML = data.map(camera => `
                    <div class="col-xl-3 col-lg-4 col-sm-6">
                        <div class="card contact_list text-center">
                            <div class="card-body">
                                <div class="user-content">
                                    <div class="user-info">
                                        <div class="user-img">
                                            <img src="../static/assets/admin/images/camera_webcam.jpg" alt="" class="avatar avatar-xl">
                                        </div>
                                        <div class="user-details">
                                            <h4 class="user-name mb-0">${camera.name}</h4>
                                            <p>${camera.roomName ?? 'No Room'}</p>
                                        </div>
                                    </div>
                                    <div class="dropdown">
                                        <a href="javascript:void(0);" class="btn sharp" data-bs-toggle="dropdown" aria-expanded="false">
                                            <svg width="24" height="6" viewBox="0 0 24 6" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M12.0012 0.359985C11.6543 0.359985 11.3109 0.428302 10.9904 0.561035C10.67 0.693767 10.3788 0.888317 10.1335 1.13358C9.88829 1.37883 9.69374 1.67 9.56101 1.99044C9.42828 2.31089 9.35996 2.65434 9.35996 3.00119C9.35996 3.34803 9.42828 3.69148 9.56101 4.01193C9.69374 4.33237 9.88829 4.62354 10.1335 4.8688C10.3788 5.11405 10.67 5.3086 10.9904 5.44134C11.3109 5.57407 11.6543 5.64239 12.0012 5.64239C12.7017 5.64223 13.3734 5.36381 13.8686 4.86837C14.3638 4.37294 14.6419 3.70108 14.6418 3.00059C14.6416 2.3001 14.3632 1.62836 13.8677 1.13315C13.3723 0.637942 12.7004 0.359826 12 0.359985H12.0012ZM3.60116 0.359985C3.25431 0.359985 2.91086 0.428302 2.59042 0.561035C2.26997 0.693767 1.97881 0.888317 1.73355 1.13358C1.48829 1.37883 1.29374 1.67 1.16101 1.99044C1.02828 2.31089 0.959961 2.65434 0.959961 3.00119C0.959961 3.34803 1.02828 3.69148 1.16101 4.01193C1.29374 4.33237 1.48829 4.62354 1.73355 4.8688C1.97881 5.11405 2.26997 5.3086 2.59042 5.44134C2.91086 5.57407 3.25431 5.64239 3.60116 5.64239C4.30165 5.64223 4.97339 5.36381 5.4686 4.86837C5.9638 4.37294 6.24192 3.70108 6.24176 3.00059C6.2416 2.3001 5.96318 1.62836 5.46775 1.13315C4.97231 0.637942 4.30045 0.359826 3.59996 0.359985H3.60116ZM20.4012 0.359985C20.0543 0.359985 19.7109 0.428302 19.3904 0.561035C19.07 0.693767 18.7788 0.888317 18.5336 1.13358C18.2883 1.37883 18.0937 1.67 17.961 1.99044C17.8283 2.31089 17.76 2.65434 17.76 3.00119C17.76 3.34803 17.8283 3.69148 17.961 4.01193C18.0937 4.33237 18.2883 4.62354 18.5336 4.8688C18.7788 5.11405 19.07 5.3086 19.3904 5.44134C19.7109 5.57407 20.0543 5.64239 20.4012 5.64239C21.1017 5.64223 21.7734 5.36381 22.2686 4.86837C22.7638 4.37294 23.0419 3.70108 23.0418 3.00059C23.0416 2.3001 22.7632 1.62836 22.2677 1.13315C21.7723 0.637942 21.1005 0.359826 20.4 0.359985H20.4012Z" fill="#A098AE"></path>
                                            </svg>
                                        </a>
                                        <div class="dropdown-menu dropdown-menu-end">
                                            <a data-id="${camera.id}" class="dropdown-item delete-slc-camera">Delete</a>
                                            <a href="#" class="dropdown-item open-edit-slc-camera-modal"
                                                data-id="${camera.id}"
                                                data-name="${camera.name}"
                                                data-mac="${camera.mac}"
                                                data-username="${camera.username}"
                                                data-password="${camera.password}"
                                                data-type="${camera.type}">
                                                Edit
                                            </a>
                                        </div>
                                    </div>
                                </div>

                                <!-- Type badge + Local badge -->
                                <div class="contact-icon">
                                    <span class="badge badge-primary light">Type : ${camera.type}</span>
                                    <span class="badge badge-success light ms-1">Local : ${camera.localName ?? 'No Local'}</span>
                                </div>

                                <div class="d-flex align-items-center mt-2">
                                    <a href="#" class="btn btn-primary btn-sm w-50 me-2"
                                        data-bs-toggle="modal"
                                        data-bs-target="#statusSlcCameraModal"
                                        data-id="${camera.id}"
                                        data-status="${camera.status}">
                                        <i class="fas fa-circle-check me-2"></i>Status
                                    </a>
                                    <a href="#" class="btn btn-sm w-50"
                                        data-bs-toggle="modal"
                                        data-bs-target="#showSlcCameraModal"
                                        data-id="${camera.id}"
                                        data-name="${camera.name}"
                                        data-mac="${camera.mac}"
                                        data-username="${camera.username}"
                                        data-password="${camera.password}"
                                        data-room="${camera.roomName ?? ''}"
                                        data-created-at="${camera.created_at}"
                                        data-type="${camera.type}">
                                        <i class="fas fa-file-alt me-2"></i>Details
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            })
            .catch(err => console.error('Error loading cameras:', err));
    }

    document.addEventListener('DOMContentLoaded', function () {
        loadCameraList();

        // ── Reload selects every time the create modal opens ──────────────────
        document.getElementById('adminNewSlcCameraModal').addEventListener('show.bs.modal', function () {
            loadCameraRooms();
            loadCameraLocals();
        });

        // ── IP Camera fields toggle ───────────────────────────────────────────
        document.getElementById('cameraType').addEventListener('change', function () {
            const ipFields = document.querySelectorAll('.ip-camera-fields');
            ipFields.forEach(el => el.style.display = this.value === 'ipcam' ? 'block' : 'none');
        });

        // ── Status modal ──────────────────────────────────────────────────────
        document.getElementById('statusSlcCameraModal').addEventListener('show.bs.modal', function (event) {
            const button = event.relatedTarget;
            document.getElementById('statusCameraId').value   = button.getAttribute('data-id');
            document.getElementById('showCameraStatus').value = button.getAttribute('data-status');
        });

        // ── Details modal ─────────────────────────────────────────────────────
        document.getElementById('showSlcCameraModal').addEventListener('show.bs.modal', function (event) {
            const button = event.relatedTarget;

            document.getElementById('showCameraDetailId').value  = button.getAttribute('data-id');
            document.getElementById('showCameraType').value      = button.getAttribute('data-type');
            document.getElementById('showCameraName').value      = button.getAttribute('data-name');
            document.getElementById('showCameraMac').value       = button.getAttribute('data-mac');
            document.getElementById('showCameraUsername').value  = button.getAttribute('data-username');
            document.getElementById('showCameraPassword').value  = button.getAttribute('data-password');
            document.getElementById('showCameraRoom').value      = button.getAttribute('data-room');
            document.getElementById('showCameraCreatedAt').value = button.getAttribute('data-created-at');

            const isIpCam = button.getAttribute('data-type') === 'ipcam';
            document.getElementById('showIpCameraFields').style.display = isIpCam ? 'block' : 'none';
        });
    });

    // ─── Camera Form Submit ───────────────────────────────────────────────────────

    document.getElementById('slcCameraForm').addEventListener('submit', function (e) {
        e.preventDefault();
        e.stopPropagation();

        const type     = document.getElementById('cameraType').value;
        const macId    = document.getElementById('cameraMacId').value;
        const name     = document.getElementById('cameraName').value;
        const username = document.getElementById('cameraUsername').value;
        const password = document.getElementById('cameraPassword').value;
        const slcId    = document.getElementById('cameraSlcLocal').value;
        const roomId   = document.getElementById('cameraRoomId').value;

        const payload = {
            type:     type,
            mac_id:   macId,
            name:     name,
            username: username,
            password: password,
            slc_id:   parseInt(slcId),
            room_id:  parseInt(roomId),
            status:   'active'          // default status required by backend
        };

        fetch('/api/create_camera', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => {
            const status = res.status;
            return res.json().then(data => ({ status, data }));
        })
        .then(({ status, data }) => {
            if (status === 200) {
                bootstrap.Modal.getInstance(
                    document.getElementById('adminNewSlcCameraModal')
                ).hide();
                document.getElementById('slcCameraForm').reset();

                Swal.fire({
                    icon: 'success',
                    title: 'Success!',
                    text: 'Camera created successfully!',
                    confirmButtonColor: '#3085d6',
                    confirmButtonText: 'OK'
                }).then(() => loadCameraList());

            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Error!',
                    text: data.Message || 'Something went wrong.',
                    confirmButtonColor: '#d33'
                });
            }
        })
        .catch(err => {
            console.error('Error submitting camera form:', err);
            Swal.fire({
                icon: 'error',
                title: 'Error!',
                text: 'Failed to connect to server.',
                confirmButtonColor: '#d33'
            });
        });
    });

    // ─── Delete Camera ────────────────────────────────────────────────────────────
    document.addEventListener('click', function (e) {
        const deleteBtn = e.target.closest('.delete-slc-camera');
        if (!deleteBtn) return;

        e.preventDefault();
        const cameraId = deleteBtn.dataset.id;

        Swal.fire({
            title: 'Are you sure?',
            text: 'This camera will be permanently deleted.',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Yes, delete it!'
        }).then(result => {
            if (!result.isConfirmed) return;

            fetch(`/api/delete_camera/${cameraId}`, { method: 'POST' })
                .then(res => {
                    const status = res.status;
                    return res.json().then(data => ({ status, data }));
                })
                .then(({ status, data }) => {
                    if (status === 200) {
                        Swal.fire({
                            icon: 'success',
                            title: 'Deleted!',
                            text: 'Camera deleted successfully.',
                            confirmButtonColor: '#3085d6'
                        }).then(() => loadCameraList());

                    } else {
                        Swal.fire({
                            icon: 'error',
                            title: 'Error!',
                            text: data.Message || 'Failed to delete camera.',
                            confirmButtonColor: '#d33'
                        });
                    }
                })
                .catch(err => {
                    console.error('Delete error:', err);
                    Swal.fire({
                        icon: 'error',
                        title: 'Error!',
                        text: 'Failed to connect to server.',
                        confirmButtonColor: '#d33'
                    });
                });
        });
    });

</script>
