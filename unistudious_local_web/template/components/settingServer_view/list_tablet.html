<div class="content-body">
    <div class="container-fluid">
        <div class="row">
            <div class="col-xl-12">
                <div class="row">
                    <div class="col-xl-12">
                        <div class="page-title flex-wrap">
                            <form id="searchForm" method="get" action="/dashboard/list-slc-tablet">
                                <div class="input-group search-area mb-3">
                                    <input type="text" id="searchInput" class="form-control"
                                           placeholder="Search here..." name="search_admin">
                                    <span class="input-group-text">
                                        <a href="javascript:void(0)">
                                            <svg width="15" height="15" viewBox="0 0 18 18" fill="none"
                                                 xmlns="http://www.w3.org/2000/svg">
                                                <path d="M17.5605 15.4395L13.7527 11.6317C14.5395 10.446 15 9.02625 15 7.5C15 3.3645 11.6355 0 7.5 0C3.3645 0 0 3.3645 0 7.5C0 11.6355 3.3645 15 7.5 15C9.02625 15 10.446 14.5395 11.6317 13.7527L15.4395 17.5605C16.0245 18.1462 16.9755 18.1462 17.5605 17.5605C18.1462 16.9747 18.1462 16.0252 17.5605 15.4395V15.4395ZM2.25 7.5C2.25 4.605 4.605 2.25 7.5 2.25C10.395 2.25 12.75 4.605 12.75 7.5C12.75 10.395 10.395 12.75 7.5 12.75C4.605 12.75 2.25 10.395 2.25 7.5V7.5Z"
                                                      fill="#01A3FF"></path>
                                            </svg>
                                        </a>
                                    </span>
                                </div>
                            </form>
                            <div>
                                <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                                        data-bs-target="#adminNewSlcTabletModal">
                                    + New Tablet
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-12">
                        <!-- Dynamic cards injected here -->
                        <div class="row" id="tabletsContainer">
                            <div class="col-12 text-center py-4">
                                <div class="spinner-border text-primary" role="status"></div>
                            </div>
                        </div>

                        <div class="table-pagenation teach">
                            <small></small>
                            <nav>
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="pagination"></div>
                                    </div>
                                </div>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Create Tablet Modal -->
<div class="modal fade" id="adminNewSlcTabletModal" tabindex="-1" aria-labelledby="adminNewSlcTabletModalLabel">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="slcTabletForm">
                <input type="hidden" id="account-id" value="3">
                <div class="modal-header">
                    <h1 class="modal-title fs-5">Tablet Details</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-xl-12">
                            <div class="mb-3">
                                <label class="form-label">MAC ID</label>
                                <input type="text" class="form-control" id="tabletMacId" name="macId" required>
                            </div>
                        </div>
                        <div class="col-xl-6">
                            <div class="mb-3">
                                <label class="form-label">Local</label>
                                <select class="form-control" id="tabletSlcLocal" name="slcLocal" required>
                                    <option value="">Select Local</option>
                                    <!-- locals injected by JS -->
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Tablet Name</label>
                                <input type="text" class="form-control" id="tabletName" name="name" required>
                            </div>
                        </div>
                        <div class="col-xl-6">
                            <div class="mb-3">
                                <label class="form-label">Room</label>
                                <select class="form-control" id="tabletRoomId" name="roomId" required>
                                    <option value="">Select Room</option>
                                    <!-- rooms injected by JS, no hardcoded options here -->
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="text" class="form-control" id="tabletPassword" name="password">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger light" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Save Tablet</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Status Modal -->
<div class="modal fade" id="statusSlcTabletModal" tabindex="-1" aria-labelledby="statusSlcTabletModalLabel">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Status Tablet</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="statusTabletId" name="id">
                <div class="mb-3">
                    <label for="showTabletStatus" class="form-label">Status</label>
                    <textarea id="showTabletStatus" rows="7" class="form-control" readonly></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Details Modal -->
<div class="modal fade" id="showSlcTabletModal" tabindex="-1" aria-labelledby="showSlcTabletModalLabel">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Tablet Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="showTabletId" name="id">
                <div class="mb-3">
                    <label for="showTabletSlc" class="form-label">Slc</label>
                    <input type="text" class="form-control" id="showTabletSlc" name="slc" readonly>
                </div>
                <div class="mb-3">
                    <label for="showTabletName" class="form-label">Name</label>
                    <input type="text" class="form-control" id="showTabletName" name="name" readonly>
                </div>
                <div class="mb-3">
                    <label for="showTabletMac" class="form-label">MAC ID</label>
                    <input type="text" class="form-control" id="showTabletMac" name="macId" readonly>
                </div>
                <div class="mb-3">
                    <label for="showTabletPassword" class="form-label">Password</label>
                    <input type="text" class="form-control" id="showTabletPassword" name="password" readonly>
                </div>

                <div class="mb-3">
                    <label for="showTabletRoom" class="form-label">Room</label>
                    <input type="text" class="form-control" id="showTabletRoom" name="room" readonly>
                </div>
                <div class="mb-3">
                    <label for="showTabletCreatedAt" class="form-label">Created At</label>
                    <input type="text" class="form-control" id="showTabletCreatedAt" name="createdAt" readonly>
                </div>
            </div>
        </div>
    </div>
</div>


<script>
const DOTS_SVG = `
<svg width="24" height="6" viewBox="0 0 24 6" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12.0012 0.359985C11.6543 0.359985 11.3109 0.428302 10.9904 0.561035C10.67 0.693767 10.3788 0.888317 10.1335 1.13358C9.88829 1.37883 9.69374 1.67 9.56101 1.99044C9.42828 2.31089 9.35996 2.65434 9.35996 3.00119C9.35996 3.34803 9.42828 3.69148 9.56101 4.01193C9.69374 4.33237 9.88829 4.62354 10.1335 4.8688C10.3788 5.11405 10.67 5.3086 10.9904 5.44134C11.3109 5.57407 11.6543 5.64239 12.0012 5.64239C12.7017 5.64223 13.3734 5.36381 13.8686 4.86837C14.3638 4.37294 14.6419 3.70108 14.6418 3.00059C14.6416 2.3001 14.3632 1.62836 13.8677 1.13315C13.3723 0.637942 12.7004 0.359826 12 0.359985H12.0012ZM3.60116 0.359985C3.25431 0.359985 2.91086 0.428302 2.59042 0.561035C2.26997 0.693767 1.97881 0.888317 1.73355 1.13358C1.48829 1.37883 1.29374 1.67 1.16101 1.99044C1.02828 2.31089 0.959961 2.65434 0.959961 3.00119C0.959961 3.34803 1.02828 3.69148 1.16101 4.01193C1.29374 4.33237 1.48829 4.62354 1.73355 4.8688C1.97881 5.11405 2.26997 5.3086 2.59042 5.44134C2.91086 5.57407 3.25431 5.64239 3.60116 5.64239C4.30165 5.64223 4.97339 5.36381 5.4686 4.86837C5.9638 4.37294 6.24192 3.70108 6.24176 3.00059C6.2416 2.3001 5.96318 1.62836 5.46775 1.13315C4.97231 0.637942 4.30045 0.359826 3.59996 0.359985H3.60116ZM20.4012 0.359985C20.0543 0.359985 19.7109 0.428302 19.3904 0.561035C19.07 0.693767 18.7788 0.888317 18.5336 1.13358C18.2883 1.37883 18.0937 1.67 17.961 1.99044C17.8283 2.31089 17.76 2.65434 17.76 3.00119C17.76 3.34803 17.8283 3.69148 17.961 4.01193C18.0937 4.33237 18.2883 4.62354 18.5336 4.8688C18.7788 5.11405 19.07 5.3086 19.3904 5.44134C19.7109 5.57407 20.0543 5.64239 20.4012 5.64239C21.1017 5.64223 21.7734 5.36381 22.2686 4.86837C22.7638 4.37294 23.0419 3.70108 23.0418 3.00059C23.0416 2.3001 22.7632 1.62836 22.2677 1.13315C21.7723 0.637942 21.1005 0.359826 20.4 0.359985H20.4012Z" fill="#A098AE"></path>
</svg>`;

document.addEventListener('DOMContentLoaded', function () {
    loadRooms();
    loadLocals();
    loadTablets();
    bindEvents();

    // Reload selects every time modal opens
    document.getElementById('adminNewSlcTabletModal').addEventListener('show.bs.modal', function () {
        loadRooms();
        loadLocals();
    });

    // ── Search bar ────────────────────────────────────────────────────────────
    document.getElementById('searchInput').addEventListener('input', function () {
        filterTablets(this.value.trim().toLowerCase());
    });

    document.getElementById('searchForm').addEventListener('submit', function (e) {
        e.preventDefault();
        filterTablets(document.getElementById('searchInput').value.trim().toLowerCase());
    });
});

// ─── Load Locals ─────────────────────────────────────────────────────────────

function loadLocals() {
    const accountId = document.getElementById('account-id').value;

    fetch(`/api/get_slc_info/${accountId}`)
        .then(res => res.json())
        .then(json => {
            const select = document.getElementById('tabletSlcLocal');
            select.innerHTML = '<option value="">Select Local</option>';

            json.data.forEach(local => {
                const option = document.createElement('option');
                option.value = local.id;
                option.textContent = local.name;
                select.appendChild(option);
            });
        })
        .catch(err => console.error('Error fetching locals:', err));
}

// ─── Load Rooms ──────────────────────────────────────────────────────────────

function loadRooms() {
    fetch('/api/get_room')
        .then(res => res.json())
        .then(json => {
            const select = document.getElementById('tabletRoomId');
            select.innerHTML = '<option value="">Select Room</option>';

            json.data.forEach(room => {
                const option = document.createElement('option');
                option.value = room.id;
                option.textContent = room.name;
                select.appendChild(option);
            });
        })
        .catch(err => console.error('Error fetching rooms:', err));
}

// ─── Load & Render Tablets ───────────────────────────────────────────────────

function loadTablets() {
    const container = document.getElementById('tabletsContainer');
    container.innerHTML = `
        <div class="col-12 text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
        </div>`;

    fetch('/api/get_all_tablet')
        .then(res => res.json())
        .then(data => renderTablets(data))
        .catch(err => {
            console.error('Fetch error:', err);
            container.innerHTML = `<p class="text-center text-danger">Failed to load tablets.</p>`;
        });
}

function renderTablets(tablets) {
    const container = document.getElementById('tabletsContainer');
    container.innerHTML = '';

    if (!tablets.length) {
        container.innerHTML = `<p class="text-center">No tablets found.</p>`;
        return;
    }

    tablets.forEach(tablet => {
        const col = document.createElement('div');
        col.className = 'col-xl-3 col-lg-4 col-sm-6';
        col.innerHTML = `
            <div class="card contact_list text-center">
                <div class="card-body">
                    <div class="user-content">
                        <div class="user-info">
                            <div class="user-img">
                                <img src="../static/assets/admin/images/tablet.jpg" alt="" class="avatar avatar-xl">
                            </div>
                            <div class="user-details">
                                <h4 class="user-name mb-0">${tablet.name}</h4>
                                <p>${tablet.roomName}</p>
                            </div>
                        </div>
                        <div class="dropdown">
                            <a href="javascript:void(0);" class="btn sharp" data-bs-toggle="dropdown">
                                ${DOTS_SVG}
                            </a>
                            <div class="dropdown-menu dropdown-menu-end">
                                <a class="dropdown-item delete-slc-tablet" data-id="${tablet.id}">Delete</a>
                                <a href="#" class="dropdown-item open-edit-slc-tablet-modal"
                                    data-id="${tablet.id}"
                                    data-name="${tablet.name}"
                                    data-mac="${tablet.mac}"
                                    data-password="${tablet.password}"
                                    data-room-id="${tablet.roomId}"
                                    data-local-id="${tablet.localId}">Edit</a>
                            </div>
                        </div>
                    </div>
                    <div class="contact-icon">
                        <span class="badge badge-success light">Room : ${tablet.roomName}</span>
                    </div>
                    <div class="d-flex align-items-center">
                        <a href="#" class="btn btn-primary btn-sm w-50 me-2 btn-status-slc-tablet"
                            data-id="${tablet.id}"
                            data-status="${tablet.status}">
                            <i class="fas fa-circle-check me-2"></i>Status
                        </a>
                        <a href="#" class="btn btn-sm w-50 btn-details-slc-tablet"
                            data-id="${tablet.id}"
                            data-name="${tablet.name}"
                            data-mac="${tablet.mac}"
                            data-password="${tablet.password}"
                            data-room="${tablet.roomName}">
                            <i class="fas fa-file-alt me-2"></i>Details
                        </a>
                    </div>
                </div>
            </div>`;
        container.appendChild(col);
    });
}

// ─── Filter Tablets ───────────────────────────────────────────────────────────

function filterTablets(query) {
    const cards = document.querySelectorAll('#tabletsContainer .col-xl-3');

    cards.forEach(card => {
        const name = card.querySelector('.user-name')?.textContent.toLowerCase() || '';
        const room = card.querySelector('.badge')?.textContent.toLowerCase()     || '';

        card.style.display = (!query || name.includes(query) || room.includes(query)) ? '' : 'none';
    });

    // Show / remove "no results" message
    const visible  = [...cards].filter(c => c.style.display !== 'none');
    const existing = document.getElementById('noResultsMsg');

    if (visible.length === 0 && cards.length > 0) {
        if (!existing) {
            const msg = document.createElement('p');
            msg.id        = 'noResultsMsg';
            msg.className = 'text-center text-muted col-12 mt-3';
            msg.textContent = 'No tablets match your search.';
            document.getElementById('tabletsContainer').appendChild(msg);
        }
    } else if (existing) {
        existing.remove();
    }
}

// ─── Bind Events ─────────────────────────────────────────────────────────────

function bindEvents() {

    document.addEventListener('click', function (e) {

        // Details button
        const detailsBtn = e.target.closest('.btn-details-slc-tablet');
        if (detailsBtn) {
            e.preventDefault();
            const tabletId = detailsBtn.dataset.id;

            fetch(`/api/view_tablet_info/${tabletId}`)
                .then(res => res.json())
                .then(data => {
                    const tablet = Array.isArray(data) ? data[0] : data;

                    document.getElementById('showTabletId').value        = tablet.id          || '';
                    document.getElementById('showTabletName').value      = tablet.name        || '';
                    document.getElementById('showTabletMac').value       = tablet.mac         || '';
                    document.getElementById('showTabletPassword').value  = tablet.password    || '';
                    document.getElementById('showTabletSlc').value       = tablet.slc_mac     || '';
                    document.getElementById('showTabletRoom').value      = detailsBtn.dataset.room || '';
                    document.getElementById('showTabletCreatedAt').value = tablet.created_at  || '';

                    new bootstrap.Modal(document.getElementById('showSlcTabletModal')).show();
                })
                .catch(err => {
                    console.error('Error fetching tablet details:', err);
                    Swal.fire({
                        icon: 'error',
                        title: 'Error!',
                        text: 'Failed to load tablet details.',
                        confirmButtonColor: '#d33'
                    });
                });
        }

        // Status button
        const statusBtn = e.target.closest('.btn-status-slc-tablet');
        if (statusBtn) {
            e.preventDefault();
            document.getElementById('statusTabletId').value   = statusBtn.dataset.id;
            document.getElementById('showTabletStatus').value = statusBtn.dataset.status;
            new bootstrap.Modal(document.getElementById('statusSlcTabletModal')).show();
        }

        // Delete button
        const deleteBtn = e.target.closest('.delete-slc-tablet');
        if (deleteBtn) {
            e.preventDefault();
            const tabletId = deleteBtn.dataset.id;

            Swal.fire({
                title: 'Are you sure?',
                text: 'This tablet will be permanently deleted.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Yes, delete it!'
            }).then(result => {
                if (!result.isConfirmed) return;

                fetch(`/api/delete_tablet/${tabletId}`, { method: 'POST' })
                    .then(res => {
                        const status = res.status;
                        return res.json().then(data => ({ status, data }));
                    })
                    .then(({ status, data }) => {
                        if (status === 200) {
                            Swal.fire({
                                icon: 'success',
                                title: 'Deleted!',
                                text: 'Tablet deleted successfully.',
                                confirmButtonColor: '#3085d6'
                            }).then(() => location.reload());
                        } else {
                            Swal.fire({
                                icon: 'error',
                                title: 'Error!',
                                text: data.Message || 'Failed to delete tablet.',
                                confirmButtonColor: '#d33'
                            });
                        }
                    })
                    .catch(err => {
                        console.error('Delete error:', err);
                        Swal.fire({
                            icon: 'error',
                            title: 'Error!',
                            text: 'Failed to connect to server.',
                            confirmButtonColor: '#d33'
                        });
                    });
            });
        }

        // ── Edit button ───────────────────────────────────────────────────────
        const editBtn = e.target.closest('.open-edit-slc-tablet-modal');
        if (editBtn) {
            e.preventDefault();
            document.getElementById('tabletName').value     = editBtn.dataset.name;
            document.getElementById('tabletMacId').value    = editBtn.dataset.mac;
            document.getElementById('tabletPassword').value = editBtn.dataset.password;
            document.getElementById('slcTabletForm').dataset.editId = editBtn.dataset.id;

            new bootstrap.Modal(document.getElementById('adminNewSlcTabletModal')).show();

            // Pre-select room & local after dropdowns finish loading
            setTimeout(() => {
                if (editBtn.dataset.roomId) {
                    document.getElementById('tabletRoomId').value = editBtn.dataset.roomId;
                }
                if (editBtn.dataset.localId) {
                    document.getElementById('tabletSlcLocal').value = editBtn.dataset.localId;
                }
            }, 400);
        }
    });

    // ─── Form Submit: Create or Update ───────────────────────────────────────

    document.getElementById('slcTabletForm').addEventListener('submit', function (e) {
        e.preventDefault();
        e.stopPropagation();

        const name     = document.getElementById('tabletName').value;
        const macId    = document.getElementById('tabletMacId').value;
        const password = document.getElementById('tabletPassword').value;
        const localId  = document.getElementById('tabletSlcLocal').value;
        const roomId   = document.getElementById('tabletRoomId').value;
        const editId   = this.dataset.editId;

        const payload = {
            name:     name,
            mac_id:   macId,
            password: password,
            slc_id:   parseInt(localId),
            room_id:  parseInt(roomId)
        };

        const url = editId ? `/api/update_tablet/${editId}` : '/api/create_tablet';

        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => {
            const status = res.status;
            return res.json().then(data => ({ status, data }));
        })
        .then(({ status, data }) => {
            if (status === 200 || status === 201) {
                bootstrap.Modal.getInstance(document.getElementById('adminNewSlcTabletModal')).hide();
                document.getElementById('slcTabletForm').reset();
                delete document.getElementById('slcTabletForm').dataset.editId;

                Swal.fire({
                    icon: 'success',
                    title: 'Success!',
                    text: editId ? 'Tablet updated successfully!' : 'Tablet created successfully!',
                    confirmButtonColor: '#3085d6',
                    confirmButtonText: 'OK'
                }).then(() => location.reload());

            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Error!',
                    text: data.Message || 'Something went wrong',
                    confirmButtonColor: '#d33'
                });
            }
        })
        .catch(err => {
            console.error('Error submitting tablet form:', err);
            Swal.fire({
                icon: 'error',
                title: 'Error!',
                text: 'Failed to connect to server',
                confirmButtonColor: '#d33'
            });
        });
    });
}
</script>
