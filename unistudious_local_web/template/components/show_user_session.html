<div class="content-body">
    <div class="container-fluid">
        <div class="top-bar">
            <div class="row">
                <div class="col-md-4">
                    <a href="/dashboard/show-session-config/{{ id_session }}" class="btn btn-secondary btn-custom">
                        <i class="fas fa-arrow-left"></i> Return
                    </a>
                </div>
            </div>
        </div>
        <div class="col-xl-12 pt-3">
            <div class="card">
                <div class="card-header border-0 p-3 d-flex justify-content-between align-items-center">
                    <h4 class="heading mb-0">Lists Users</h4>
                    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#pdfExportModal">
                        Download List
                    </button>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive basic-tbl">
                        <style>
    #example thead th:last-child,
    #example tbody td:last-child {
        text-align: right !important;
    }
</style>

                        <table id="example" class="display dataTable no-footer" style="min-width: 845px; width: 1023px;">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Group</th>
                                    <th>Completions Tag</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="actionGroupModal" tabindex="-1" aria-labelledby="actionGroupModalLabel" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="actionGroupModalLabel">Edit Groups</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="actionSelect">Choose an Action</label>
                    <select class="form-control" id="actionSelect">
                        <option value="" disabled selected>Please Select One Action</option>
                        <option value="join">Join New Group</option>
                        <option value="change">Change Group</option>
                        <option value="remove">Remove from Group</option>
                    </select>
                </div>
                <div class="form-group mt-3" id="dynamicGroupSelect" style="display: none;">
                    <label for="groupUserSelect">Select a Group to Join</label>
                    <select class="form-control" id="groupUserSelect">
                        <option value="" disabled selected>Loading groups...</option>
                    </select>
                </div>
                <div class="form-group mt-3" id="currentGroupContainer" style="display: none;">
                    <label for="currentGroupSelect">Current Group</label>
                    <select class="form-control" id="currentGroupSelect">
                        <option value="">Select Current Group</option>
                    </select>
                </div>
                <div class="form-group mt-3" id="preferredGroupWrapper" style="display: none;">
                    <label for="preferredGroupSelect">Select Preferred Group</label>
                    <select class="form-control" id="preferredGroupSelect">
                        <option value="">Please select a preferred group</option>
                    </select>
                </div>
                <div class="form-group mt-3" id="currentGroupRemoveWrapper" style="display: none;">
                    <label for="currentGroupRemoveSelect">Select Group to Remove</label>
                    <select class="form-control" id="currentGroupRemoveSelect">
                        <option value="">Please select a group to remove</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="confirmActionButton">Confirm</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editVirtualUserSessionModal" tabindex="-1" aria-labelledby="editVirtualUserSessionModalLabel" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editVirtualUserSessionModalLabel">Virtual User Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="session-id">
                <input type="hidden" id="user-id">

                <div class="mb-3">
                    <label for="virtual-user-fullName-session" class="form-label">Virtual User Name</label>
                    <input type="text" id="virtual-user-fullName-session" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="virtual-user-phone-session" class="form-label">Virtual User Phone</label>
                    <input type="text" id="virtual-user-phone-session" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="virtual-user-email-session" class="form-label">Virtual User Email</label>
                    <input type="text" id="virtual-user-email-session" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label text-primary">Extra Data</label>
                    <div id="virtualExtraDataContainer"></div>
                    <button type="button" class="btn btn-secondary btn-sm mt-2" id="addVirtualExtraDataRow">Add Field</button>
                    <input type="hidden" id="virtualExtraDataJson">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveVirtualUserSession">Save Information</button>
            </div>
        </div>
    </div>
</div>

<!-- ✅ JQUERY FIRST -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- ✅ DATATABLES SECOND -->
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>

<!-- ✅ SAVE OUR JQUERY BEFORE ANYTHING OVERWRITES IT -->
<script>
    // Save our jQuery with DataTables attached
    var dt$ = jQuery.noConflict(true);
    console.log('✅ Saved jQuery with DataTables:', typeof dt$.fn.DataTable);
</script>

<script>
    // Use our saved jQuery (dt$) instead of $
    (function($) {
        $(document).ready(function() {
            console.log('✅ Ready! DataTable available:', typeof $.fn.DataTable);

            const SESSION_ID = {{ id_session }};
            let dataTable = null;

            function loadUserSessionData(sessionId) {
                fetch(`/api/get_user_session_info/${sessionId}`)
                    .then(response => response.json())
                    .then(result => {
                        if (dataTable) {
                            dataTable.destroy();
                            dataTable = null;
                        }

                        const tbody = document.querySelector('#example tbody');
                        tbody.innerHTML = '';

                        if (!result.Data || result.Data.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="4" class="text-center">No data available</td></tr>';
                            dataTable = $('#example').DataTable({
                                paging: true,
                                pageLength: 10,
                                searching: false,
                                lengthChange: false,
                                language: {
                                    emptyTable: "No data available",
                                    paginate: {
                                        next: '<i class="fa-solid fa-angle-right"></i>',
                                        previous: '<i class="fa-solid fa-angle-left"></i>'
                                    }
                                }
                            });
                            return;
                        }

                        result.Data.forEach(function(user) {
                            var row = document.createElement('tr');
                            row.innerHTML = '<td>' + user.username + '</td>' +
                                '<td><div class="d-flex align-items-center">' +
                                '<a class="edit-group-action btn btn-sm btn-outline-success me-2" data-bs-toggle="modal" data-bs-target="#actionGroupModal" data-user-id="' + user.user_id + '" data-session-id="' + user.session_id + '" style="cursor:pointer">' +
                                '<i class="fas fa-pencil-alt"></i> Edit</a>' +
                                '<div>' + (user.relation_group_local_session_id || 'N/A') + '</div></div></td>' +
                                '<td><div class="d-flex align-items-center">' +
                                '<a class="edit-completion-tag-action btn btn-sm btn-outline-success me-2" data-bs-toggle="modal" data-bs-target="#actionCompletionTagModal" data-user-id="' + user.user_id + '" data-session-id="' + user.session_id + '" style="cursor:pointer">' +
                                '<i class="fas fa-pencil-alt"></i> Edit</a><div>N/A</div></div></td>' +
                                '<td><div class="d-flex align-items-center justify-content-end">' +
                                '<div class="icon-box icon-box-sm bg-light me-2">' +
                                '<a class="delete-relation-user-session" style="cursor:pointer" data-user-id="' + user.user_id + '" data-session-id="' + user.session_id + '">' +
                                '<i class="material-icons" style="font-size:10px;color:red">delete</i></a></div>' +
                                '<div class="icon-box icon-box-sm bg-light">' +
                                '<a class="edit-virtual-user-session" style="cursor:pointer" data-bs-toggle="modal" data-bs-target="#editVirtualUserSessionModal" data-user-id="' + user.user_id + '" data-session-id="' + user.session_id + '">' +
                                '<i class="fas fa-pencil-alt" style="font-size:10px;color:green"></i></a></div></div></td>';
                            tbody.appendChild(row);
                        });

                        dataTable = $('#example').DataTable({
                            createdRow: function(row) {
                                $(row).addClass('selected');
                            },
                            searching: false,
                            pageLength: 10,
                            select: false,
                            lengthChange: false,
                            language: {
                                paginate: {
                                    next: '<i class="fa-solid fa-angle-right"></i>',
                                    previous: '<i class="fa-solid fa-angle-left"></i>'
                                }
                            }
                        });
                        console.log('✅ Done!');
                    })
                    .catch(function(error) {
                        console.error('Error:', error);
                    });
            }

            $('#actionSelect').on('change', function() {
                var val = $(this).val();
                $('#dynamicGroupSelect').toggle(val === 'join');
                $('#currentGroupContainer').toggle(val === 'change');
                $('#preferredGroupWrapper').toggle(val === 'change');
                $('#currentGroupRemoveWrapper').toggle(val === 'remove');
            });

            $('#actionGroupModal').on('show.bs.modal', function(e) {
                var trigger = e.relatedTarget;
                if (!trigger) return;
                $(this).data('userId', $(trigger).data('user-id'));
                $(this).data('sessionId', $(trigger).data('session-id'));
            });

            // Delete relation - alert user id
            $(document).on('click', '.delete-relation-user-session', function() {
                var userId = $(this).data('user-id');
                var sessionId = $(this).data('session-id');

                Swal.fire({
                    title: 'Are you sure?',
                    text: 'This will delete the user from this session and cannot be undone!',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    cancelButtonColor: '#6c757d',
                    confirmButtonText: 'Yes, delete it!',
                    cancelButtonText: 'Cancel'
                }).then((result) => {
                    if (result.isConfirmed) {
                        fetch(`/api/delete_user_session/${userId}/${sessionId}`, {
                            method: 'POST'
                        })
                        .then(response => response.json())
                        .then(data => {
                            Swal.fire({
                                title: 'Deleted!',
                                text: data.Message,
                                icon: 'success',
                                timer: 2000,
                                showConfirmButton: false
                            });
                            loadUserSessionData(SESSION_ID); // ✅ refresh the table
                        })
                        .catch(error => {
                            Swal.fire('Error!', 'Something went wrong.', 'error');
                        });
                    }
                });
            });

            if (SESSION_ID) {
                loadUserSessionData(SESSION_ID);
            }
        });
    })(dt$); // ✅ Use our saved jQuery
</script>
