<div class="content-body">
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-header">
                        <h4>Reset Password</h4>
                    </div>
                    <div class="card-body">
                        <div class="basic-form">
                            <form id="change_password_form" name="change_password" method="post"
                                  enctype="multipart/form-data">
                                <div class="mb-3">
                                    <label class="text-label form-label" for="Password">
                                        Old Password
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text"> <i class="fa fa-lock"></i> </span>
                                        <input type="password" id="change_password_oldPassword"
                                               name="change_password[oldPassword]" required="required"
                                               class="form-control password-input">
                                        <span class="input-group-text show-pass active">
													<i class="fa fa-eye-slash"></i>
													<i class="fa fa-eye"></i>
                                            </span>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="text-label form-label" for="password">New Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text"> <i class="fa fa-lock"></i> </span>
                                        <input type="password" id="change_password_password_first"
                                               name="change_password[password][first]" required="required"
                                               class="form-control password-input" minlength="4" maxlength="25">
                                        <span class="input-group-text show-pass active">
													<i class="fa fa-eye-slash"></i>
													<i class="fa fa-eye"></i>
                                            </span>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="text-label form-label" for="password">Confirm Password</label>
                                    <div class="input-group transparent-append">
                                        <span class="input-group-text"> <i class="fa fa-lock"></i> </span>
                                        <input type="password" id="change_password_password_second"
                                               name="change_password[password][second]" required="required"
                                               class="form-control password-input" minlength="4" maxlength="25">
                                        <span class="input-group-text show-pass active">
													<i class="fa fa-eye-slash"></i>
													<i class="fa fa-eye"></i>
                                            </span>
                                    </div>
                                </div>

                                <div class="float-end">
                                    <button type="submit" class="btn me-3 btn-outline-primary">Change</button>
                                    <a href="/dashboard" class="btn btn-outline-danger">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
    $('#change_password_form').on('submit', function (e) {
        e.preventDefault();

        Swal.fire({
            icon: 'info',
            title: 'Action non disponible / Not available',
            text: 'Le changement de mot de passe ne peut être effectué que sur la plateforme en ligne, pas en local. / Password change can only be done on the online platform, not locally.',
            confirmButtonColor: '#4c4b9e',
            confirmButtonText: 'OK'
        });

        return false;
    });
});
</script>
