<div class="content-body">
    <div class="container-fluid">
        <div class="row">
            <div class="col-cl-12">
                <div class="row">
                    <div class="col-xl-12">
                        <div class="card" id="accordion-one">
                            <div class="card-header flex-wrap px-3">
                                <div>
                                    <h4 class="card-title">My Students</h4>
                                </div>
                                <ul class="nav nav-tabs dzm-tabs" id="myTab" role="tablist">
                                    <li class="nav-item" role="presentation">
                                        <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                                                data-bs-target="#addStudentModal">
                                            + Student
                                        </button>
                                    </li>
                                </ul>
                            </div>
                            <!--column-->
                            <div class="row">
                                <div class="col-md-12">
                                    <div class="card">
                                        <div class="card-body p-0">
                                            <div class="table-responsive">
                                                <table id="example8" class="display table" style="min-width: 845px">
                                                    <thead>
                                                    <tr>
                                                        <th>Full Name</th>
                                                        <th>Phone</th>
                                                        <th>Email</th>
                                                        <th>Type</th>
                                                        <th>Action</th>
                                                    </tr>
                                                    </thead>
                                                    <tbody>
                                                    <!-- rows injected by JS -->
                                                    </tbody>
                                                </table>
                                            </div>

                                            <!-- ✅ Pagination below the table -->
                                            <div class="row mt-3">
                                                <div class="col-md-12">
                                                    <div class="pagination" id="pagination-container">
                                                        <ul class="pagination pagination-gutter pagination-primary no-bg"
                                                            id="pagination-controls">
                                                        </ul>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- Modal edit virtual user -->
<div class="modal fade" id="editStudentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="editStudentForm">
                <div class="modal-header">
                    <h5 class="modal-title">Edit My Student</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="userId" id="editUserId" value="419">
                    <input type="hidden" name="account" id="editAccountId" value="">
                    <input type="hidden" name="id" id="editId" value="419">

                    <div class="mb-3">
                        <label for="editName" class="form-label">Name</label>
                        <input type="text" name="name" id="editName" class="form-control">
                    </div>
                    <!-- Email -->
                    <div class="mb-3">
                        <label for="editEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="editEmail" name="email"
                               placeholder="Enter email address" required="">
                    </div>
                    <div class="mb-3">
                        <label for="editPhone" class="form-label">Phone</label>
                        <input type="text" name="phone" id="editPhone" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="editStatus" class="form-label">Status</label>
                        <select name="status" id="editStatus" class="form-control">
                            <option value="1">Active</option>
                            <option value="0">Inactive</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>


<!-- Modal manager session virtual user -->
<div class="modal fade" id="manageSessionsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="manageSessionsModalLabel">Manage Sessions</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="manageSessionsForm">
                    <input type="hidden" id="sessionUserId" name="userId" value="756">

                    <div id="relationsContainer">
                        <div class="relation-block border rounded p-3 mb-3" data-index="1">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h6 class="mb-0">Relation #1</h6>
                                <button type="button" class="btn btn-sm btn-danger removeRelationBtn">Remove</button>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Select Session</label>
                                <select name="sessions[]" class="form-control sessionSelect" required=""
                                        data-live-search="true">

                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="mt-3">
                        <button type="button" class="btn btn-outline-success btn-sm" id="addRelationBtn">
                            + Add Session Relation
                        </button>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary" form="manageSessionsForm">Save</button>
            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="addStudentModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addStudentModalLabel">Add New Student</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="createVirtualStudentForm" enctype="multipart/form-data">
                    <!-- Full Name -->
                    <div class="mb-3">
                        <label for="studentFullName" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="studentFullName" name="name"
                               placeholder="Enter full name" required="">
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="studentEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="studentEmail" name="email"
                               placeholder="Enter email address" required="">
                    </div>

                    <!-- Phone -->
                    <div class="mb-3">
                        <label for="studentPhone" class="form-label">Phone</label>
                        <input type="tel" class="form-control" id="studentPhone" name="phone"
                               placeholder="Enter phone number" required="">
                    </div>

                    <!-- Status -->
                    <div class="mb-3">
                        <label for="studentStatus" class="form-label">Status</label>
                        <div class="">
                            <select class="form-control" id="studentStatus" name="status" required="">
                                <option value="">Select status</option>
                                <option value="1">Active</option>
                                <option value="0">Inactive</option>
                            </select>

                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary" form="createVirtualStudentForm">Save Student</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal associate virtual user -->
<div class="modal fade" id="associateVirtualUserModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Associate Virtual User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="associateVirtualUserForm">
                    <input type="hidden" name="virtualId" id="virtualId">
                    <input type="hidden" name="virtualUserId" id="virtualUserId">

                    <div class="mb-3">
                        <label for="realUserSelect" class="form-label">Select Real User</label>
                        <select id="realUserSelect" name="realUserId" class="form-control selectpicker" required data-live-search="true">
                            <option value="" disabled selected>-- Select a student --</option>
                            <!-- options injected/populated by JS -->
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-outline-primary" form="associateVirtualUserForm">Associate</button>
            </div>
        </div>
    </div>
</div>

<script>window.ACCOUNT_ID = {{ account_id }};</script>
<script src="{{ url_for('static', filename='js/dashboard/my_student.js') }}"></script>
