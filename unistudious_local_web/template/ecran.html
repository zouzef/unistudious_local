<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Piuma Academy - Calendar</title>

    <!-- Same theme + FullCalendar files as the tablet calendar page -->
    <link rel="stylesheet" href="/static/vendor/fullcalendar-5.11.0/lib/main.css">
    <link href="/static/css/style.css" rel="stylesheet">
    <script src="/static/vendor/fullcalendar-5.11.0/lib/main.js"></script>

    <style>
        #clock { font-size: 2rem; font-weight: 700; color: #4c4b9e; }

        /* hover tooltip */
        #tip {
            position: fixed;
            z-index: 9999;
            display: none;
            min-width: 220px;
            max-width: 340px;
            padding: 12px 16px;
            background: #4c4b9e;
            color: #fff;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .3);
            font-size: 1rem;
            line-height: 1.5;
            pointer-events: none;
        }
        #tip .t-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; }
        #tip .t-row span { opacity: .75; }

        /* ---------- layout: calendar fills the whole page ---------- */
        html, body { height: 100%; margin: 0 !important; padding: 0 !important; overflow: hidden; }
        #main-wrapper,
        .content-body,
        .container-fluid,
        .container-fluid > .row,
        .col-xl-12 { height: 100%; }

        .content-body { margin: 0 !important; padding: 0 !important; }
        .container-fluid { padding: 0 !important; max-width: 100% !important; }
        .container-fluid > .row { margin: 0 !important; }
        .col-xl-12 { padding: 0 !important; }

        .card { height: 100%; margin: 0 !important; border-radius: 0; }
        .card-body { height: 100%; padding: 6px 10px !important; }
        #calendar { height: 100%; }

        /* ---------- event text size: change these numbers ---------- */
        .fc .fc-event-title,
        .fc .fc-event-time { font-size: 1.25rem !important; line-height: 1.4 !important; }
        .fc .fc-daygrid-event { padding: 2px 6px !important; }

        /* ---------- event layout: class name on top, time below ---------- */
        .fc .fc-event-main-frame {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;
            height: 100%;
        }
        .fc .fc-event-title-container {
            order: 1;
            flex: 0 0 auto !important;
            width: 100%;
        }
        .fc .fc-event-time {
            order: 2;
            width: 100%;
            opacity: .85;
            white-space: normal !important;
        }
        .fc .fc-event-title {
            display: block;
            font-weight: 700 !important;
            white-space: normal !important;
            text-align: center !important;
        }
        .fc .fc-daygrid-event .fc-event-main-frame {
            flex-direction: row !important;
            justify-content: flex-start !important;
            text-align: left !important;
        }
        .fc .fc-daygrid-event .fc-event-time { order: 0; width: auto; margin-right: 6px; }
        .fc .fc-daygrid-event .fc-event-title-container { order: 1; width: auto; }

        /* ---------- toolbar design ---------- */
        .fc .fc-header-toolbar {
            padding: 8px 12px;
            margin-bottom: 8px !important;
            align-items: center;
        }
        .fc .fc-toolbar-title {
            font-size: 1.8rem !important;
            font-weight: 700;
            color: #2f2e6e;
        }

        /* ---------- day header row (Lun 19/10 ...) ---------- */
        .fc .fc-col-header-cell {
            background: #ecebf8;
        }
        .fc .fc-col-header-cell-cushion {
            display: block;
            padding: 10px 4px !important;
            font-size: 1.3rem !important;
            font-weight: 700;
            color: #2f2e6e;
            text-transform: uppercase;
            letter-spacing: .03em;
            text-decoration: none !important;
        }

        /* hide prev / next / today (keypad + idle reset still work, they are in the JS) */
        .fc .fc-header-toolbar .fc-toolbar-chunk:first-child .fc-button-group,
        .fc .fc-header-toolbar .fc-prev-button,
        .fc .fc-header-toolbar .fc-next-button,
        .fc .fc-header-toolbar .fc-today-button {
            display: none !important;
        }

        /* hide month / week / day buttons (the view is set by data-view in the HTML) */
        .fc .fc-header-toolbar .fc-toolbar-chunk:last-child .fc-button-group,
        .fc .fc-header-toolbar .fc-dayGridMonth-button,
        .fc .fc-header-toolbar .fc-timeGridWeek-button,
        .fc .fc-header-toolbar .fc-timeGridDay-button {
            display: none !important;
        }

        /* ---------- salle label (.fc-roomLabel-button, created by ecran.js) ---------- */
        /* default state: "All salles" = soft purple pill */
        .fc .fc-header-toolbar .fc-roomLabel-button {
            display: inline-flex !important;
            align-items: center;
            gap: 10px;
            margin-left: 0 !important;
            padding: 8px 22px !important;
            background: #ecebf8 !important;
            color: #4c4b9e !important;
            border: 1px solid #d6d4f0 !important;
            border-radius: 999px !important;
            box-shadow: none !important;
            font-size: 1.15rem !important;
            font-weight: 700 !important;
            letter-spacing: .04em;
            text-transform: uppercase;
            line-height: 1.3 !important;
            white-space: nowrap;
        }
        .fc .fc-header-toolbar .fc-roomLabel-button::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4c4b9e;
            flex: 0 0 auto;
        }

        /* a salle is selected = solid brand purple pill */
        .fc .fc-header-toolbar .fc-roomLabel-button.room-active {
            background: #4c4b9e !important;
            color: #fff !important;
            border-color: #4c4b9e !important;
            font-size: 1.4rem !important;
            padding: 8px 26px !important;
            box-shadow: 0 4px 12px rgba(76, 75, 158, .35) !important;
        }
        .fc .fc-header-toolbar .fc-roomLabel-button.room-active::before {
            background: #fff;
        }

        /* session modal */
        #ev-modal {
            position: fixed; inset: 0; z-index: 10000;
            display: none; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, .55);
        }
        #ev-modal .m-box {
            position: relative; width: 90%; max-width: 560px;
            background: #fff; border-radius: 14px; padding: 28px 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .35);
        }
        #ev-modal-close {
            position: absolute; top: 10px; right: 16px;
            border: 0; background: none; font-size: 2rem; line-height: 1; cursor: pointer; color: #666;
        }
        #ev-modal .m-title { font-size: 1.6rem; font-weight: 700; color: #4c4b9e; padding-left: 12px; margin-bottom: 18px; }
        #ev-modal .m-row { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 1.15rem; }
        #ev-modal .m-row span { min-width: 90px; color: #888; }
        #ev-modal .m-row b { font-weight: 600; color: #222; }
    </style>
</head>
<body>

<!-- "show" class: the theme keeps #main-wrapper invisible until its own JS adds it -->
<div id="main-wrapper" class="show">
    <div class="content-body">
        <div class="container-fluid">
            <div class="row">
                <div class="col-xl-12">
                    <div class="card">
                        <div class="card-body">
                            <div id="calendar" class="app-fullcalendar" data-account-id="{{ account_id }}"
                                 data-view="timeGridWeek"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="ev-modal">
    <div class="m-box">
        <button id="ev-modal-close" type="button">&times;</button>
        <div id="ev-modal-body"></div>
    </div>
</div>

<div id="tip"></div>

<!-- Display options added BEFORE ecran.js (French day headers + start time). No logic changed. -->
<script>
(function () {
    var DAYS = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
    var SLOT_MIN_TIME = '06:00:00';   // first hour shown in the week/day grid

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function dayWithDate(arg) {
        var d = arg.date.marker;
        return DAYS[d.getUTCDay()] + ' ' + pad(d.getUTCDate()) + '/' + pad(d.getUTCMonth() + 1);
    }
    function dayOnly(arg) {
        return DAYS[arg.date.marker.getUTCDay()];
    }

    var Original = FullCalendar.Calendar;
    FullCalendar.Calendar = class extends Original {
        constructor(el, options) {
            options = options || {};
            if (!options.slotMinTime) options.slotMinTime = SLOT_MIN_TIME;
            if (!options.scrollTime) options.scrollTime = SLOT_MIN_TIME;
            options.views = Object.assign({
                timeGridWeek: { dayHeaderFormat: dayWithDate },
                timeGridDay: { dayHeaderFormat: dayWithDate },
                dayGridMonth: { dayHeaderFormat: dayOnly }
            }, options.views || {});
            super(el, options);
        }
    };
})();
</script>
<script src="/static/js/ecran.js?v=6"></script>
</body>
</html>
